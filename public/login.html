<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kazuma | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-pink: #ff2d55;
            --neon-blue: #00f3ff;
            --dark-bg: #0d0d0d;
            --card-bg: #1a1a2e;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand { font-weight: 800; font-size: 1.8rem; letter-spacing: 2px; margin-bottom: 10px; }
        .brand span { color: var(--neon-pink); }

        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.7rem; color: #a0a0a0; text-transform: uppercase; margin-bottom: 8px; font-weight: bold; letter-spacing: 1px; }

        .input-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            color: white;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .input-field:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }

        .btn-login {
            width: 100%;
            background: var(--neon-pink);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 45, 85, 0.4); }

        .footer-links { margin-top: 25px; font-size: 0.8rem; color: #777; }
        .footer-links a { color: var(--neon-blue); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand">API <span>KAZUMA</span></div>
        <p style="color: #666; font-size: 0.85rem; margin-bottom: 30px;">AUTH PROTOCOL v2.0</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Usuario o Correo</label>
                <input type="text" id="identifier" class="input-field" placeholder="félix_dev" required>
            </div>
            
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" class="input-field" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Acceder al Sistema</button>
        </form>

        <div class="footer-links">
            ¿No tienes acceso? <a href="/register.html">Crea una cuenta</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const loginData = {
                identifier: document.getElementById('identifier').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(loginData)
                });

                const data = await response.json();

                if (data.status) {
                    localStorage.setItem('userSession', JSON.stringify(data.user));
                    window.location.href = '/index.html';
                } else {
                    alert(data.message || 'Error en las credenciales.');
                }
            } catch (error) {
                alert('Fallo en la conexión con el servidor.');
            }
        });
    </script>
</body>
</html>
