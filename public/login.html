<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kazuma | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --neon-pink: #ff2d55;
            --neon-blue: #00f3ff;
            --dark-bg: #0d0d0d;
            --card-bg: #1a1a2e;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .bg-blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--neon-pink);
            filter: blur(150px);
            opacity: 0.15;
            z-index: 0;
        }

        .glass {
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        .brand { font-weight: 800; font-size: 1.8rem; letter-spacing: 2px; }
        .brand span { color: var(--neon-pink); }

        .input-dark {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: 0.3s;
        }

        .input-dark:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
        }

        .btn-neon {
            background: var(--neon-pink);
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .btn-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 45, 85, 0.4);
            background: #ff4d73;
        }
    </style>
</head>
<body>

    <div class="bg-blob" style="top: -10%; left: -10%;"></div>
    <div class="bg-blob" style="bottom: -10%; right: -10%; background: var(--neon-blue);"></div>

    <div class="glass p-10 rounded-[2.5rem] w-full max-w-md border-t-2 border-t-white/10">
        <div class="text-center mb-8">
            <div class="brand mb-2">API <span>KAZUMA</span></div>
            <p class="text-gray-500 text-[10px] uppercase tracking-[0.3em] font-bold">Protocolo de Acceso</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-[10px] uppercase tracking-widest text-gray-400 mb-2 ml-1 font-bold">Correo o Usuario</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-600 text-xs"></i>
                    <input type="text" id="email" class="input-dark w-full pl-11 p-4 rounded-2xl outline-none" placeholder="IDENTIDAD" required>
                </div>
            </div>

            <div>
                <label class="block text-[10px] uppercase tracking-widest text-gray-400 mb-2 ml-1 font-bold">Contraseña</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-600 text-xs"></i>
                    <input type="password" id="password" class="input-dark w-full pl-11 p-4 rounded-2xl outline-none" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-neon w-full py-4 rounded-2xl text-white shadow-lg">
                Iniciar Sesión
            </button>
        </form>

        <p class="mt-8 text-center text-gray-500 text-xs">
            ¿Sin credenciales? <a href="/register.html" class="text-[#00f3ff] font-bold hover:underline">Solicitar Acceso</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const loginData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(loginData)
                });

                const data = await response.json();

                if (data.status) {
                    localStorage.setItem('userSession', JSON.stringify(data.user));
                    window.location.href = '/index.html';
                } else {
                    alert(data.message || 'Error de autenticación.');
                }
            } catch (error) {
                alert('Fallo en el enlace con el servidor de la API.');
            }
        });
    </script>
</body>
</html>
