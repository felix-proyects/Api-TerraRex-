<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Búsquedas | Api Kazuma</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-pink: #ff2d55;
            --neon-blue: #00f3ff;
            --dark-bg: #0d0d0d;
            --card-bg: #161625;
            --sidebar-bg: #121212;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --code-bg: #212135;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--sidebar-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky; top: 0; z-index: 1000;
        }
        .brand { font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; cursor: pointer; }
        .brand span { color: var(--neon-pink); }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-back:hover { background: var(--neon-pink); border-color: var(--neon-pink); }

        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; box-sizing: border-box; flex-grow: 1; }

        .api-card {
            background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .code-box {
            background: #0d0d1a; padding: 12px; border-radius: 12px; font-family: monospace;
            font-size: 0.75rem; color: var(--neon-blue); margin: 15px 0; border: 1px solid rgba(0,243,255,0.1);
            word-break: break-all;
        }
        .input-test {
            width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1);
            padding: 14px; border-radius: 12px; color: white; margin-bottom: 10px; outline: none; box-sizing: border-box;
        }
        .select-test {
            width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1);
            padding: 14px; border-radius: 12px; color: white; margin-bottom: 10px; outline: none; box-sizing: border-box;
        }
        .btn-test {
            background: var(--neon-pink); color: white; border: none; padding: 14px; width: 100%;
            border-radius: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
        }

        .result-box {
            background: #05050a; color: #00ffcc; padding: 15px; border-radius: 12px;
            margin-top: 15px; font-size: 0.7rem; font-family: monospace; border: 1px solid rgba(0, 255, 204, 0.1);
            white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto;
        }

        .footer { 
            text-align: center; padding: 25px 20px; color: var(--text-muted); font-size: 0.7rem; 
            font-weight: 600; line-height: 1.6; cursor: pointer; user-select: none;
        }

        h2 { border-left: 5px solid var(--neon-blue); padding-left: 15px; font-weight: 900; }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="location.href='/'">KAZUMA <span>DASH</span></div>
        <button class="btn-back" onclick="location.href='/'"><i class="fas fa-home"></i> VOLVER</button>
    </header>

    <div class="container">
        <h2>BÚSQUEDAS</h2>

        <div class="api-card">
            <p style="font-weight: 700;"><i class="fab fa-tiktok" style="color:#ffffff"></i> TIKTOK SEARCH</p>
            <div id="ts-box" class="code-box">GET /api/search/tiktok?query=&apikey=</div>
            <input id="in-ts" class="input-test" placeholder="Ej: edits de anime, bailes...">
            <button class="btn-test" onclick="testTiktokSearch()">Buscar en TikTok</button>
            <div id="res-ts" class="result-box">Esperando acción...</div>
        </div>

        <div class="api-card">
            <p style="font-weight: 700;"><i class="fab fa-pinterest" style="color:#bd081c"></i> PINTEREST SEARCH</p>
            <div id="ps-box" class="code-box">GET /api/search/pinterest?query=&type=&apikey=</div>
            <input id="in-ps" class="input-test" placeholder="Ej: anime aesthetic...">
            <select id="type-ps" class="select-test">
                <option value="">Todo</option>
                <option value="image">Solo Imágenes</option>
                <option value="video">Solo Videos</option>
                <option value="gif">Solo GIFs</option>
            </select>
            <button class="btn-test" onclick="testPinterestSearch()">Buscar en Pinterest</button>
            <div id="res-ps" class="result-box">Esperando acción...</div>
        </div>
    </div>

    <footer class="footer" onclick="location.href='https://kazuma.giize.com'">
        <p>Copyright © 2026 API Kazuma. All rights reserved.<br>Powered by PixelCrew-Team.</p>
    </footer>

    <script>
        const user = JSON.parse(localStorage.getItem('userSession'));
        if (!user) window.location.href = '/login';

        window.onload = () => {
            document.getElementById('ts-box').innerText = `GET /api/search/tiktok?query=&apikey=${user.apikey}`;
            document.getElementById('ps-box').innerText = `GET /api/search/pinterest?query=&type=&apikey=${user.apikey}`;
        };

        // Búsqueda TikTok
        async function testTiktokSearch() {
            const query = document.getElementById('in-ts').value;
            const resBox = document.getElementById('res-ts');
            if (!query) return alert("Ingresa un término para TikTok");

            resBox.innerHTML = "OBTENIENDO RESULTADOS Y LINKS SIN MARCA DE AGUA...";
            try {
                const response = await fetch(`/api/search/tiktok?query=${encodeURIComponent(query)}&apikey=${user.apikey}`);
                const data = await response.json();
                resBox.innerHTML = JSON.stringify(data, null, 2);
            } catch (err) { 
                resBox.innerHTML = "ERROR: No se pudo conectar con el servidor."; 
            }
        }

        // Búsqueda Pinterest
        async function testPinterestSearch() {
            const query = document.getElementById('in-ps').value;
            const type = document.getElementById('type-ps').value;
            const resBox = document.getElementById('res-ps');
            if (!query) return alert("Ingresa un término para Pinterest");

            resBox.innerHTML = "BUSCANDO EN PINTEREST...";
            try {
                let url = `/api/search/pinterest?query=${encodeURIComponent(query)}&apikey=${user.apikey}`;
                if(type) url += `&type=${type}`;

                const response = await fetch(url);
                const data = await response.json();
                resBox.innerHTML = JSON.stringify(data, null, 2);
            } catch (err) { 
                resBox.innerHTML = "ERROR: No se pudo conectar con el servidor."; 
            }
        }
    </script>
</body>
</html>
