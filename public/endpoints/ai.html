<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IA | Api Kazuma</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-pink: #ff2d55; --neon-blue: #00f3ff; --dark-bg: #0d0d0d;
            --card-bg: #161625; --sidebar-bg: #121212; --text-main: #ffffff;
            --text-muted: #a0a0a0; --code-bg: #212135;
        }
        body { background-color: var(--dark-bg); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 50px; }
        header { background-color: var(--sidebar-bg); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); position: sticky; top: 0; z-index: 1000; }
        .brand { font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; cursor: pointer; }
        .brand span { color: var(--neon-pink); }
        .btn-back { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 15px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-back:hover { background: var(--neon-pink); }
        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        .api-card { background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .code-box { background: #0d0d1a; padding: 12px; border-radius: 12px; font-family: monospace; font-size: 0.75rem; color: var(--neon-blue); margin: 15px 0; border: 1px solid rgba(0,243,255,0.1); word-break: break-all; }
        .input-label { font-size: 0.7rem; color: var(--neon-blue); margin-bottom: 5px; display: block; font-weight: 700; text-transform: uppercase; }
        .input-test { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 12px; color: white; margin-bottom: 15px; outline: none; box-sizing: border-box; }
        .btn-test { background: var(--neon-pink); color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
        .result-box { background: #05050a; color: #00ffcc; padding: 15px; border-radius: 12px; margin-top: 15px; font-size: 0.7rem; font-family: monospace; border: 1px solid rgba(0, 255, 204, 0.1); white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; }
        h2 { border-left: 5px solid var(--neon-pink); padding-left: 15px; font-weight: 900; text-transform: uppercase; }
        .endpoint-title { font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .endpoint-title i { color: var(--neon-pink); }
    </style>
</head>
<body>

<header>
    <div class="brand" onclick="location.href='/'">KAZUMA <span>DASH</span></div>
    <button class="btn-back" onclick="location.href='/dash'"><i class="fas fa-home"></i> VOLVER</button>
</header>

<div class="container">
    <h2>INTELIGENCIA ARTIFICIAL</h2>

    <div class="api-card">
        <div class="endpoint-title">
            <i class="fas fa-robot"></i> GEMINI AI
        </div>
        
        <div class="code-box" id="gemini-path">GET /api/ai/gemini?text=</div>
        
        <span class="input-label">Pregunta</span>
        <input id="in-gemini-text" class="input-test" placeholder="Escribe tu pregunta...">
        
        <span class="input-label">Cookie de Sesión (Obligatorio)</span>
        <input id="in-gemini-cookie" class="input-test" value="cookie" placeholder="Escribe la cookie...">
        
        <button class="btn-test" onclick="testGemini()">Consultar Gemini</button>
        
        <div id="res-gemini" class="result-box">Esperando consulta...</div>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('userSession'));
    if (!user) window.location.href = '/login';

    window.onload = () => {
        const el = document.getElementById(`gemini-path`);
        if(el) el.innerText += `&cookie=...&apikey=${user.apikey}`;
    };

    async function testGemini() {
        const queryText = document.getElementById('in-gemini-text').value;
        const queryCookie = document.getElementById('in-gemini-cookie').value;
        const resBox = document.getElementById('res-gemini');
        
        if (!queryText) return alert("Ingresa un texto para la IA");
        if (!queryCookie) return alert("La Cookie es obligatoria para procesar la petición");
        
        resBox.innerHTML = "PENSANDO...";
        
        try {
            // URL con ambos parámetros obligatorios
            const url = `/api/ai/gemini?text=${encodeURIComponent(queryText)}&cookie=${encodeURIComponent(queryCookie)}&apikey=${user.apikey}`;

            const response = await fetch(url);
            const data = await response.json();
            resBox.innerHTML = JSON.stringify(data, null, 2);
        } catch (err) { 
            resBox.innerHTML = "ERROR DE CONEXIÓN"; 
        }
    }
</script>
</body>
</html>
