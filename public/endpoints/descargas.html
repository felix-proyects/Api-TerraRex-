<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Descargas | Api Kazuma</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --neon-pink: #ff2d55; --neon-blue: #00f3ff; --dark-bg: #0d0d0d; --card-bg: #161625; --sidebar-bg: #121212; --text-main: #ffffff; --text-muted: #a0a0a0; --code-bg: #212135; }
        body { background-color: var(--dark-bg); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 50px; }
        header { background-color: var(--sidebar-bg); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); position: sticky; top: 0; z-index: 1000; }
        .brand { font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; cursor: pointer; }
        .brand span { color: var(--neon-pink); }
        .btn-back { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 15px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-back:hover { background: var(--neon-pink); }
        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        .api-card { background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .code-box { background: #0d0d1a; padding: 12px; border-radius: 12px; font-family: monospace; font-size: 0.75rem; color: var(--neon-blue); margin: 15px 0; border: 1px solid rgba(0,243,255,0.1); word-break: break-all; }
        .input-test { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 12px; color: white; margin-bottom: 10px; outline: none; box-sizing: border-box; }
        .btn-test { background: var(--neon-pink); color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
        .result-box { background: #05050a; color: #00ffcc; padding: 15px; border-radius: 12px; margin-top: 15px; font-size: 0.7rem; font-family: monospace; border: 1px solid rgba(0, 255, 204, 0.1); white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; }
        h2 { border-left: 5px solid var(--neon-pink); padding-left: 15px; font-weight: 900; }
        .endpoint-title { font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .endpoint-title i { color: var(--neon-pink); }
    </style>
</head>
<body>
<header>
    <div class="brand" onclick="location.href='/'">KAZUMA <span>DASH</span></div>
    <button class="btn-back" onclick="location.href='/'"><i class="fas fa-home"></i> VOLVER</button>
</header>
<div class="container">
    <h2>DESCARGAS</h2>
    <div class="api-card">
        <div class="endpoint-title"><i class="fab fa-tiktok"></i> TIKTOK</div>
        <div class="code-box" id="tt-path">GET /api/download/tiktok?url=</div>
        <input id="in-tt" class="input-test" placeholder="URL de TikTok...">
        <button class="btn-test" onclick="testApi('tt', '/api/download/tiktok')">Probar TikTok</button>
        <div id="res-tt" class="result-box">...</div>
    </div>
    <div class="api-card">
        <div class="endpoint-title"><i class="fab fa-instagram"></i> INSTAGRAM</div>
        <div class="code-box" id="ig-path">GET /api/download/instagram?url=</div>
        <input id="in-ig" class="input-test" placeholder="URL de Instagram...">
        <button class="btn-test" onclick="testApi('ig', '/api/download/instagram')">Probar Instagram</button>
        <div id="res-ig" class="result-box">...</div>
    </div>
    <div class="api-card">
        <div class="endpoint-title"><i class="fab fa-facebook"></i> FACEBOOK</div>
        <div class="code-box" id="fb-path">GET /api/download/facebook?url=</div>
        <input id="in-fb" class="input-test" placeholder="URL de Facebook...">
        <button class="btn-test" onclick="testApi('fb', '/api/download/facebook')">Probar Facebook</button>
        <div id="res-fb" class="result-box">...</div>
    </div>
    <div class="api-card">
        <div class="endpoint-title"><i class="fab fa-twitter"></i> TWITTER (X)</div>
        <div class="code-box" id="tw-path">GET /api/download/twitter?url=</div>
        <input id="in-tw" class="input-test" placeholder="URL de Twitter...">
        <button class="btn-test" onclick="testApi('tw', '/api/download/twitter')">Probar Twitter</button>
        <div id="res-tw" class="result-box">...</div>
    </div>
    <div class="api-card">
        <div class="endpoint-title"><i class="fab fa-pinterest"></i> PINTEREST</div>
        <div class="code-box" id="pin-path">GET /api/download/pinterest?url=</div>
        <input id="in-pin" class="input-test" placeholder="URL de Pinterest...">
        <button class="btn-test" onclick="testApi('pin', '/api/download/pinterest')">Probar Pinterest</button>
        <div id="res-pin" class="result-box">...</div>
    </div>
</div>
<script>
    const user = JSON.parse(localStorage.getItem('userSession'));
    if (!user) window.location.href = '/login';
    window.onload = () => {
        const ids = ['tt', 'ig', 'fb', 'tw', 'pin'];
        ids.forEach(id => {
            const el = document.getElementById(`${id}-path`);
            if(el) el.innerText += `&apikey=${user.apikey}`;
        });
    };
    async function testApi(id, route, paramName = 'url') {
        const queryValue = document.getElementById(`in-${id}`).value;
        const resBox = document.getElementById(`res-${id}`);
        if (!queryValue) return alert("Ingresa una URL");
        resBox.innerHTML = "PROCESANDO...";
        try {
            const response = await fetch(`${route}?${paramName}=${queryValue}&apikey=${user.apikey}`);
            const data = await response.json();
            resBox.innerHTML = JSON.stringify(data, null, 2);
        } catch (err) { resBox.innerHTML = "ERROR DE CONEXIÓN"; }
    }
</script>
</body>
</html>
