<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Descargas | Api Kazuma</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-pink: #ff2d55;
            --neon-blue: #00f3ff;
            --dark-bg: #0d0d0d;
            --card-bg: #161625;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- LOADER 4S --- */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark-bg); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px; height: 50px; border: 3px solid rgba(0, 243, 255, 0.1);
            border-top: 3px solid var(--neon-blue); border-radius: 50%;
            animation: spin 1s linear infinite; box-shadow: 0 0 15px var(--neon-blue);
        }
        .loading-text {
            margin-top: 20px; font-size: 0.7rem; font-weight: 900;
            letter-spacing: 2px; color: var(--neon-blue); text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* Botón Volver Estilo Dashboard */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-left: 20px;
            transition: 0.3s;
            cursor: pointer;
            width: fit-content;
        }
        .btn-back:hover {
            background: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 45, 85, 0.4);
        }

        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; box-sizing: border-box; flex-grow: 1; }

        .api-card {
            background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .input-test {
            width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1);
            padding: 14px; border-radius: 12px; color: white; margin-bottom: 10px; outline: none; box-sizing: border-box;
        }
        .btn-test {
            background: var(--neon-pink); color: white; border: none; padding: 14px; width: 100%;
            border-radius: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
        }

        .result-box {
            background: #05050a; color: #00ffcc; padding: 15px; border-radius: 12px;
            margin-top: 15px; font-size: 0.7rem; font-family: monospace; border: 1px solid rgba(0, 255, 204, 0.1);
            white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto;
        }

        .footer { text-align: center; padding: 25px 20px; color: var(--text-muted); font-size: 0.7rem; }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="spinner"></div>
        <div class="loading-text">Cargando API...</div>
    </div>

    <div class="btn-back" onclick="location.href='/'">
        <i class="fas fa-arrow-left"></i> VOLVER AL DASHBOARD
    </div>

    <div class="container">
        <h2 style="border-left:5px solid var(--neon-pink); padding-left:15px; font-weight:900;">DESCARGAS</h2>

        <div class="api-card">
            <p><i class="fab fa-instagram"></i> INSTAGRAM DOWNLOADER</p>
            <input id="in-dl" class="input-test" placeholder="Pega el enlace de Instagram aquí...">
            <button class="btn-test" onclick="testDownload()">Descargar</button>
            <div id="res-dl" class="result-box">...</div>
        </div>
    </div>

    <footer class="footer">
        <p>Copyright © 2026 API Kazuma. All rights reserved.</p>
    </footer>

    <script>
        const user = JSON.parse(localStorage.getItem('userSession'));
        if (!user) window.location.href = '/login';

        async function testDownload() {
            const urlIn = document.getElementById('in-dl').value;
            const resBox = document.getElementById('res-dl');
            if (!urlIn) return alert("Ingresa una URL");

            resBox.innerHTML = "PROCESANDO...";
            try {
                const res = await fetch(`/api/download/ig?url=${encodeURIComponent(urlIn)}&apikey=${user.apikey}`);
                const data = await res.json();
                resBox.innerHTML = JSON.stringify(data, null, 2);
            } catch (err) { 
                resBox.innerHTML = "ERROR DE CONEXIÓN"; 
            }
        }

        window.onload = () => {
            const startTime = Date.now();
            const remainingTime = Math.max(0, 4000 - (Date.now() - startTime));
            setTimeout(() => {
                const preloader = document.getElementById('preloader');
                preloader.style.opacity = '0';
                setTimeout(() => { preloader.style.display = 'none'; }, 500);
            }, remainingTime);
        };
    </script>
</body>
</html>
