<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Cuenta - Api Kazuma</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --neon-pink: #ff2d55;
            --bg-dark: #0d1117;
            --card-bg: #161b22;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .verify-container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid var(--neon-pink);
            box-shadow: 0 0 25px rgba(255, 45, 85, 0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 span {
            color: var(--neon-pink);
        }

        p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 25px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: white;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 45, 85, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--neon-pink);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #30363d;
            cursor: not-allowed;
            transform: none;
        }

        .resend-link {
            display: block;
            color: var(--neon-pink);
            text-decoration: none;
            font-size: 13px;
            margin-top: 20px;
            cursor: pointer;
            font-weight: 500;
        }

        .resend-link.disabled {
            color: #484f58;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 35px;
            font-size: 11px;
            color: #484f58;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="verify-container">
        <h1>Kazuma <span>Verify</span></h1>
        <p>Introduce el código de 6 dígitos enviado a tu correo.</p>

        <input type="text" id="vCode" placeholder="000000" maxlength="6">
        <button id="btnVerify" onclick="verificar()">Verificar Cuenta</button>

        <span id="resendCode" class="resend-link" onclick="reenviar()">¿No te llegó el código? Reenviar</span>

        <div class="footer">
            Copyright © 2026 Kazuma. All rights reserved.<br>
            Powered by <b>PixelCrew-Team</b>
        </div>
    </div>

    <script>
        // Al cargar, capturamos el ID de la URL y lo guardamos
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const code = params.get('code');

            if (id) {
                localStorage.setItem('pending_id', id);
            }

            if (code) {
                document.getElementById('vCode').value = code;
            }

            // Si ya está logueado, fuera
            if (localStorage.getItem('apikey') && localStorage.getItem('apikey') !== 'kzm-PENDING-VERIFICATION') {
                window.location.href = '/dash';
            }

            checkCooldown();
        };

        function checkCooldown() {
            const lastResend = localStorage.getItem('last_resend');
            if (lastResend) {
                const diff = Date.now() - lastResend;
                const wait = 60 * 1000; // 1 minuto de espera
                if (diff < wait) {
                    startTimer(Math.ceil((wait - diff) / 1000));
                }
            }
        }

        function startTimer(seconds) {
            const link = document.getElementById('resendCode');
            link.classList.add('disabled');
            link.onclick = null;

            const timer = setInterval(() => {
                seconds--;
                link.innerText = `Reenviar disponible en ${seconds}s`;
                if (seconds <= 0) {
                    clearInterval(timer);
                    link.innerText = "¿No te llegó el código? Reenviar";
                    link.classList.remove('disabled');
                    link.onclick = reenviar;
                }
            }, 1000);
        }

        async function verificar() {
            const code = document.getElementById('vCode').value;
            const userId = new URLSearchParams(window.location.search).get('id') || localStorage.getItem('pending_id');
            const btn = document.getElementById('btnVerify');

            if (!code || code.length < 6) return Swal.fire('Error', 'Código incompleto', 'error');
            if (!userId) return Swal.fire('Error', 'Falta el ID de usuario', 'error');

            btn.disabled = true;
            btn.innerText = "Procesando...";

            try {
                const res = await fetch('/api/auth/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: userId, code: code })
                });
                const data = await res.json();

                if (data.status) {
                    Swal.fire({
                        title: '¡Éxito!',
                        text: 'Cuenta verificada correctamente',
                        icon: 'success',
                        background: '#161b22',
                        color: '#fff',
                        confirmButtonColor: '#ff2d55'
                    }).then(() => {
                        localStorage.setItem('apikey', data.apikey);
                        localStorage.removeItem('pending_id');
                        window.location.href = '/login';
                    });
                } else {
                    Swal.fire('Error', data.message, 'error');
                    btn.disabled = false;
                    btn.innerText = "Verificar Cuenta";
                }
            } catch (e) {
                Swal.fire('Error', 'Error de conexión', 'error');
                btn.disabled = false;
                btn.innerText = "Verificar Cuenta";
            }
        }

        async function reenviar() {
            const userId = new URLSearchParams(window.location.search).get('id') || localStorage.getItem('pending_id');

            if (!userId) return Swal.fire('Error', 'No se encontró el ID', 'error');

            try {
                const res = await fetch('/api/auth/resend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: userId })
                });
                const data = await res.json();

                if (data.status) {
                    Swal.fire({
                        title: 'Enviado',
                        text: 'Revisa tu bandeja de entrada o spam',
                        icon: 'success',
                        background: '#161b22',
                        color: '#fff',
                        confirmButtonColor: '#ff2d55'
                    });
                    localStorage.setItem('last_resend', Date.now());
                    startTimer(60);
                } else {
                    Swal.fire('Error', data.message, 'error');
                }
            } catch (e) {
                Swal.fire('Error', 'Fallo al conectar con el servidor', 'error');
            }
        }
    </script>
</body>
</html>
