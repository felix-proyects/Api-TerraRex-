<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kazuma | Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-pink: #ff2d55;
            --neon-blue: #00f3ff;
            --dark-bg: #0d0d0d;
            --card-bg: #161625;
        }
        body { background: var(--dark-bg); color: white; font-family: 'Inter', sans-serif; }
        .glass { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .input-kazuma { background: #000 !exports; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .input-kazuma:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        .btn-pink { background: var(--neon-pink); transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-pink:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-help { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #a0a0a0; }
        .btn-help:hover { background: var(--neon-blue); color: #000; border-color: var(--neon-blue); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="glass p-8 rounded-3xl w-full max-w-md">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black tracking-tighter">KAZUMA <span style="color: var(--neon-pink);">REGISTRO</span></h2>
            <p class="text-slate-500 text-sm mt-1">Crea tu acceso a la infraestructura</p>
        </div>
        
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Username</label>
                <input type="text" id="username" class="input-kazuma w-full rounded-xl p-3 outline-none text-white" placeholder="Ej: felix_dev" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Email</label>
                <input type="email" id="email" class="input-kazuma w-full rounded-xl p-3 outline-none text-white" placeholder="correo@ejemplo.com" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Password</label>
                <input type="password" id="password" class="input-kazuma w-full rounded-xl p-3 outline-none text-white" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-pink w-full font-black py-4 rounded-xl shadow-lg mt-2">Crear Cuenta</button>
        </form>

        <div class="mt-6 flex flex-col gap-3 text-center">
            <p class="text-slate-500 text-sm">
                ¿Ya tienes cuenta? <a href="/login.html" class="font-bold" style="color: var(--neon-blue);">Inicia sesión</a>
            </p>
            
            <hr class="border-white/5 my-2">
            
            <a href="mailto:pixelcrewteam@gmail.com" class="btn-help py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition">
                <i class="fas fa-question-circle"></i> ¿NECESITAS AYUDA? CONTACTAR
            </a>
        </div>
    </div>

    <script>
        if (localStorage.getItem('hasAccount') === 'true') {
            window.location.href = '/login.html';
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                const data = await response.json();

                if (data.status) {
                    localStorage.setItem('hasAccount', 'true');
                    alert('Registro exitoso.');
                    window.location.href = '/login.html';
                } else {
                    alert(data.message || 'Error al registrar.');
                }
            } catch (error) {
                alert('Error de conexión con el servidor.');
            }
        });
    </script>
</body>
</html>
