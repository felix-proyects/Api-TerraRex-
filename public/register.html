<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kazuma | Registro</title>
    <script>
        if (localStorage.getItem('userSession')) {
            window.location.href = '/dash';
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --neon-pink: #ff2d55; --neon-blue: #00f3ff; --dark-bg: #0d0d0d; --card-bg: #161625; }
        body { background: var(--dark-bg); color: white; font-family: 'Inter', sans-serif; margin: 0; }
        #safety-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; }
        .glass { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .input-kazuma { background: #080810; border: 1px solid rgba(255,255,255,0.1); color: #ffffff !important; transition: 0.3s; }
        .input-kazuma:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        .btn-pink { background: var(--neon-pink); transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-pink:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div id="safety-overlay"></div>
    <div class="glass p-8 rounded-3xl w-full max-w-md">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-black tracking-tighter uppercase">KAZUMA <span style="color: var(--neon-pink);">REGISTRO</span></h2>
            <p class="text-slate-500 text-xs mt-1 uppercase font-bold">Infraestructura Central</p>
        </div>
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-[10px] font-black text-slate-500 mb-1 uppercase">Username</label>
                <input type="text" id="username" class="input-kazuma w-full rounded-xl p-3 outline-none" placeholder="Usuario" required>
            </div>
            <div>
                <label class="block text-[10px] font-black text-slate-500 mb-1 uppercase">Email</label>
                <input type="email" id="email" class="input-kazuma w-full rounded-xl p-3 outline-none" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="relative">
                <label class="block text-[10px] font-black text-slate-500 mb-1 uppercase">Password</label>
                <input type="password" id="password" minlength="8" class="input-kazuma w-full rounded-xl p-3 outline-none" placeholder="••••••••" required>
                <i class="fas fa-eye absolute right-4 top-9 cursor-pointer text-slate-600" onclick="togglePassword('password', this)"></i>
            </div>
            <div class="relative">
                <label class="block text-[10px] font-black text-slate-500 mb-1 uppercase">Confirmar Password</label>
                <input type="password" id="confirmPassword" class="input-kazuma w-full rounded-xl p-3 outline-none" placeholder="••••••••" required>
                <i class="fas fa-eye absolute right-4 top-9 cursor-pointer text-slate-600" onclick="togglePassword('confirmPassword', this)"></i>
            </div>
            <div class="flex items-center gap-2 mt-2">
                <input type="checkbox" id="tos" class="w-4 h-4 accent-[#ff2d55]" required>
                <label for="tos" class="text-[10px] text-slate-400 font-bold uppercase">Acepto los términos</label>
            </div>
            <button type="submit" id="btnSubmit" class="btn-pink w-full font-black py-4 rounded-xl shadow-lg mt-2">Crear Cuenta</button>
        </form>
        <div class="mt-6 text-center">
            <p class="text-slate-500 text-sm">¿Ya tienes cuenta? <a href="/login.html" class="font-bold" style="color: var(--neon-blue);">Inicia sesión</a></p>
        </div>
    </div>
    <script>
        window.onload = () => {
            document.getElementById('safety-overlay').style.display = 'none';
        };

        function togglePassword(id, el) {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
            el.classList.toggle("fa-eye");
            el.classList.toggle("fa-eye-slash");
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (pass !== confirmPass) {
                Swal.fire('Error', 'Las contraseñas no coinciden.', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Procesando...';

            const userData = {
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: pass
            };

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                const data = await response.json();

                if (data.status) {
                    Swal.fire('¡Éxito!', 'Revisa tu correo.', 'success').then(() => {
                        window.location.href = `/verify.html?id=${data.id}`;
                    });
                } else {
                    btn.disabled = false;
                    btn.innerText = 'Crear Cuenta';
                    Swal.fire('Error', data.message, 'error');
                }
            } catch (error) {
                btn.disabled = false;
                btn.innerText = 'Crear Cuenta';
                Swal.fire('Error', 'Servidor no responde.', 'error');
            }
        });
    </script>
</body>
</html>
