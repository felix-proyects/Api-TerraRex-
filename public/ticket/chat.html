<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kazuma | Admin Chat</title>
    <script>
        const session = JSON.parse(localStorage.getItem('userSession'));
        if (!session || session.role !== 'admin') window.location.href = '/dash';
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --admin-blue: #00f3ff; --dark-bg: #050505; --panel-bg: #11111d; }
        body { background: var(--dark-bg); color: white; font-family: 'Inter', sans-serif; }
        .ticket-card { background: var(--panel-bg); border-left: 4px solid #333; transition: 0.3s; }
        .ticket-card.active { border-left-color: var(--admin-blue); background: #1a1a2e; }
        .chat-view { background: #0a0a0f; border: 1px solid rgba(255,255,255,0.05); height: calc(100vh - 200px); overflow-y: auto; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-80 border-r border-white/5 flex flex-col">
        <div class="p-6 border-b border-white/5">
            <h2 class="font-black text-xl">TICKETS <span class="text-cyan-400">ADMIN</span></h2>
        </div>
        <div id="ticketList" class="flex-1 overflow-y-auto p-4 space-y-3">
            </div>
    </aside>

    <main class="flex-1 flex flex-col">
        <header id="chatHeader" class="p-6 border-b border-white/5 flex justify-between items-center">
            <p class="text-slate-500 font-bold uppercase text-xs">Selecciona un ticket para responder</p>
        </header>

        <div id="adminChatBox" class="chat-view p-6 flex flex-col gap-4">
            </div>

        <footer class="p-6 bg-black/50 border-t border-white/5">
            <form id="adminReplyForm" class="flex gap-3">
                <input type="text" id="adminMsg" class="flex-1 bg-white/5 border border-white/10 rounded-xl px-5 py-4 outline-none focus:border-cyan-500" placeholder="Responder al usuario..." disabled>
                <button type="button" id="closeBtn" class="bg-red-500/10 text-red-500 px-6 rounded-xl font-bold border border-red-500/20 hover:bg-red-500 hover:text-white transition" disabled>CERRAR</button>
                <button type="submit" class="bg-cyan-500 text-black px-8 rounded-xl font-black hover:opacity-80" disabled>ENVIAR</button>
            </form>
        </footer>
    </main>

    <script>
        let currentTicketId = null;

        window.onload = () => {
            loadAllTickets();
            setInterval(loadAllTickets, 5000);
        };

        async function loadAllTickets() {
            const res = await fetch('/api/tickets/all'); // API para admins
            const tickets = await res.json();
            const list = document.getElementById('ticketList');
            
            list.innerHTML = tickets.map(t => `
                <div onclick="selectTicket('${t.userEmail}', '${t.username}')" class="ticket-card p-4 rounded-xl cursor-pointer hover:bg-white/5 ${currentTicketId === t.userEmail ? 'active' : ''}">
                    <p class="font-black text-sm">${t.username}</p>
                    <p class="text-[10px] text-slate-500">${t.userEmail}</p>
                    <span class="text-[9px] ${t.open ? 'text-cyan-400' : 'text-red-500'} font-bold">${t.open ? 'OPEN' : 'CLOSED'}</span>
                </div>
            `).join('');
        }

        async function selectTicket(email, name) {
            currentTicketId = email;
            document.getElementById('chatHeader').innerHTML = `<h3 class="font-black">Chat con: <span class="text-cyan-400">${name}</span></h3>`;
            
            // Habilitar controles
            const inputs = ['adminMsg', 'closeBtn'].forEach(id => document.getElementById(id).disabled = false);
            document.querySelector('#adminReplyForm button[type="submit"]').disabled = false;
            
            loadChatMessages();
        }

        async function loadChatMessages() {
            if (!currentTicketId) return;
            const res = await fetch(`/api/tickets/my-ticket?email=${currentTicketId}`);
            const data = await res.json();
            const box = document.getElementById('adminChatBox');

            box.innerHTML = data.messages.map(m => `
                <div class="max-w-[70%] p-3 rounded-xl text-sm ${m.role === 'admin' ? 'bg-cyan-900/30 border border-cyan-500/30 self-end' : 'bg-white/5 self-start'}">
                    <p class="text-[9px] font-bold opacity-40 uppercase">${m.role}</p>
                    ${m.text}
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('adminReplyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('adminMsg').value;
            await fetch('/api/tickets/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentTicketId, text, role: 'admin' })
            });
            document.getElementById('adminMsg').value = '';
            loadChatMessages();
        });

        document.getElementById('closeBtn').onclick = async () => {
            if (!confirm('¿Cerrar este ticket?')) return;
            await fetch('/api/tickets/close', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentTicketId })
            });
            currentTicketId = null;
            location.reload();
        };
    </script>
</body>
</html>
