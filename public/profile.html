<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kazuma | Mi Perfil</title>

    <script src="https://www.google.com/recaptcha/api.js?render=6LfFHtksAAAAAL8LYF35rZe4fFVpu-o4ULtCtuXa"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --neon-pink: #ff2d55;
            --neon-blue: #00f3ff;
            --dark-bg: #0d0d0d;
        }

        /* CONFIGURACIÓN DEL CAPTCHA PEQUEÑO ABAJO */
        .grecaptcha-badge { 
            width: 70px !important; 
            right: 0px !important; 
            bottom: 0px !important; 
            transform: scale(0.75) !important; 
            transform-origin: bottom right !important;
            opacity: 0.8;
            z-index: 999;
        }

        body { background-color: var(--dark-bg); color: white; font-family: 'Inter', sans-serif; }
        .glass { background: #161625; border: 1px solid rgba(255,255,255,0.1); }

        .profile-container { position: relative; width: 130px; margin: 0 auto; }

        #view-img { 
            width: 120px; height: 120px; border-radius: 50%; object-fit: cover; 
            border: 2px solid var(--neon-pink); background: #1a1a2e; 
            box-shadow: 0 0 15px rgba(255, 45, 85, 0.2); display: block;
        }

        .camera-btn {
            position: absolute; right: 5px; bottom: 5px; background: var(--neon-blue);
            color: black; width: 35px; height: 35px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 3px solid #161625; transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }
        .camera-btn:hover { transform: scale(1.1); background: white; }

        .input-dark { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; }
        .label-clear { color: #ffffff; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="p-4 border-b border-white/10 flex justify-between items-center sticky top-0 bg-[#0d0d0d] z-50">
        <div class="font-bold text-xl uppercase tracking-tighter">KAZUMA <span>PROFILER</span></div>
        <button onclick="location.href='/dash'" class="text-sm bg-white/10 px-4 py-2 rounded-xl">
            <i class="fas fa-arrow-left mr-2"></i> INICIO
        </button>
    </header>

    <main class="container mx-auto p-4 flex-grow max-w-2xl">
        <div class="glass rounded-3xl p-8 mt-6 text-center">
            <div class="profile-container mb-6">
                <img id="view-img" src="https://upload.yotsuba.giize.com/u/oco-1ZRU.jpg" alt="Foto de perfil">
                <label for="file-input" class="camera-btn">
                    <i class="fas fa-camera text-sm"></i>
                </label>
                <input type="file" id="file-input" accept="image/*" class="hidden" onchange="uploadToYotsuba(this)">
            </div>
            <h2 id="view-username" class="text-2xl font-black">...</h2>
            <p id="view-id" class="text-blue-400 font-mono text-sm">ID: 00000000</p>
        </div>

        <div class="glass rounded-3xl p-8 mt-8">
            <h3 class="text-xl font-bold mb-6 flex items-center uppercase tracking-tighter">
                <i class="fas fa-cog mr-3 text-pink-500"></i> Ajustes de Cuenta
            </h3>
            <div class="space-y-6">
                <div>
                    <label class="block label-clear mb-2">Nombre de Usuario</label>
                    <div class="flex gap-2">
                        <input type="text" id="new-username" class="input-dark w-full p-3 rounded-xl outline-none" placeholder="Nuevo nombre...">
                        <button onclick="updateData('username')" class="bg-pink-600 px-5 rounded-xl font-bold text-xs uppercase">Cambiar</button>
                    </div>
                </div>
                </div>
        </div>
    </main>

    <script>
        const session = JSON.parse(localStorage.getItem('userSession'));
        if (!session) window.location.href = '/login.html';

        grecaptcha.ready(function() {
            grecaptcha.execute('6LfFHtksAAAAAL8LYF35rZe4fFVpu-o4ULtCtuXa', {action: 'profile'});
        });

        async function loadProfile() {
            const res = await fetch(`/api/auth/user/${session.id}`);
            const data = await res.json();
            if (data.status) {
                const u = data.user;
                document.getElementById('view-username').innerText = u.username.toUpperCase();
                document.getElementById('view-id').innerText = `ID: ${u.id}`;
                if (u.profile_img) document.getElementById('view-img').src = u.profile_img;
            }
        }

        // --- LÓGICA DE SUBIDA A YOTSUBA ---
        async function uploadToYotsuba(input) {
            const file = input.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                // 1. Subir a tu servicio de hosting
                const resUpload = await fetch('https://upload.yotsuba.giize.com/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const dataUpload = await resUpload.json();

                // Aquí asumo que tu API devuelve { url: 'https://...' } o { fileUrl: '...' }
                // Ajusta 'dataUpload.url' según lo que responda tu web de Yotsuba
                const finalUrl = dataUpload.url || dataUpload.fileUrl || dataUpload.link;

                if (finalUrl) {
                    // 2. Guardar el enlace en tu base de datos de Kazuma
                    const resUpdate = await fetch(`/api/auth/update`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            id: session.id, 
                            type: 'profile_img', 
                            value: finalUrl 
                        })
                    });

                    if ((await resUpdate.json()).status) {
                        document.getElementById('view-img').src = finalUrl;
                        alert("Perfil actualizado con éxito.");
                    }
                } else {
                    alert("Error: No se recibió enlace de Yotsuba.");
                }
            } catch (err) {
                console.error(err);
                alert("Error al conectar con el servidor de imágenes.");
            }
        }

        // Resto de funciones (updateData, logout, etc.) idénticas a las anteriores.
        window.onload = loadProfile;
    </script>
</body>
</html>
