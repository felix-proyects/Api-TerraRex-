<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kazuma | Staff Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // BLOQUEO DE ENTRADA INICIAL
        (function() {
            const session = JSON.parse(localStorage.getItem('userSession'));
            if (!session || session.role !== 'admin') {
                window.location.replace('/404.html');
            }
        })();
    </script>
    <style>
        :root {
            --neon-pink: #ff2d55;
            --neon-blue: #00f3ff;
            --dark-bg: #0d0d0d;
        }
        body { 
            background-color: #000000 !important; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            visibility: hidden; 
        }
        .authorized body { visibility: visible; background-color: var(--dark-bg) !important; }
        
        .glass { background: rgba(26, 26, 46, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .input-dark { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: white; }
        .table-container { overflow-x: auto; }
        tr { border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        .badge-verified { background: rgba(0, 243, 255, 0.1); color: var(--neon-blue); border: 1px solid rgba(0, 243, 255, 0.2); }
        .badge-pending { background: rgba(255, 171, 0, 0.1); color: #ffab00; border: 1px solid rgba(255, 171, 0, 0.2); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d0d0d; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-pink); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="p-4 border-b border-white/5 flex justify-between items-center sticky top-0 bg-[#0d0d0d] z-50">
        <div class="font-bold text-xl uppercase tracking-tighter">KAZUMA <span class="text-[#ff2d55]">STAFF</span></div>
        <button onclick="location.href='/dash'" class="text-sm bg-white/10 px-4 py-2 rounded-lg hover:bg-white/20 transition">
            <i class="fas fa-arrow-left mr-2"></i> Dashboard
        </button>
    </header>

    <main class="container mx-auto p-4 flex-grow">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 mt-4">
            <div class="glass p-6 rounded-2xl border-l-4 border-[#ff2d55] flex justify-between items-center">
                <div>
                    <p class="text-xs text-gray-400 uppercase font-bold tracking-widest">Usuarios Registrados</p>
                    <h3 id="total-users-count" class="text-4xl font-black text-white mt-1">0</h3>
                </div>
                <div class="bg-pink-500/10 p-4 rounded-xl">
                    <i class="fas fa-users text-[#ff2d55] text-2xl"></i>
                </div>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="flex-grow flex gap-2">
                <input type="text" id="searchQuery" class="input-dark w-full p-4 rounded-2xl outline-none focus:border-[#ff2d55] transition-all text-white" placeholder="Buscar por Nombre, Correo o ID...">
                <button onclick="searchUser()" class="bg-[#ff2d55] px-7 rounded-2xl font-bold shadow-lg shadow-pink-500/20 hover:scale-105 active:scale-95 transition">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>

        <div class="glass rounded-3xl overflow-hidden border border-white/5 shadow-2xl">
            <div class="table-container">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-white/5 text-[10px] uppercase tracking-widest text-gray-400">
                        <tr>
                            <th class="p-5 font-black">Usuario / Email</th>
                            <th class="p-5 font-black">Estado</th>
                            <th class="p-5 font-black">Consumo</th>
                            <th class="p-5 text-center font-black">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body" class="text-sm">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="editModal" class="fixed inset-0 bg-black/95 hidden items-center justify-center z-[9999] p-4 backdrop-blur-md">
        <div class="glass p-8 rounded-[2.5rem] max-w-md w-full relative border border-white/10 text-white">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-gray-500 hover:text-white transition">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h2 class="text-2xl font-black mb-2 text-[#ff2d55] tracking-tighter uppercase">Gestión Staff</h2>
            <p class="text-[10px] text-gray-400 mb-6 uppercase tracking-widest font-bold">Modificar Privilegios</p>

            <form id="editForm" class="space-y-4">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="text-[10px] text-gray-500 uppercase font-black block mb-1">Nombre de Usuario</label>
                    <input type="text" id="edit-username" class="input-dark w-full p-3 rounded-xl outline-none">
                </div>
                <div>
                    <label class="text-[10px] text-gray-500 uppercase font-black block mb-1">Correo Electrónico</label>
                    <input type="email" id="edit-email" class="input-dark w-full p-3 rounded-xl outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] text-gray-500 uppercase font-black block mb-1">Rango</label>
                        <select id="edit-role" class="input-dark w-full p-3 rounded-xl outline-none">
                            <option value="user">USER</option>
                            <option value="admin">ADMIN</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-500 uppercase font-black block mb-1">Límite Diario</label>
                        <input type="number" id="edit-limit" class="input-dark w-full p-3 rounded-xl outline-none">
                    </div>
                </div>

                <div id="delete-zone" class="pt-2"></div>

                <button type="submit" class="w-full bg-[#ff2d55] p-4 rounded-2xl font-black shadow-xl shadow-pink-500/20 hover:brightness-110 active:scale-95 transition-all uppercase tracking-widest mt-2">
                    Guardar Cambios
                </button>
            </form>
        </div>
    </div>

    <script>
        const session = JSON.parse(localStorage.getItem('userSession'));
        const SUPER_ADMIN_EMAIL = "frasesbebor@gmail.com";

        // BLINDAJE DE VERIFICACIÓN PARA ADMINS
        async function checkAdminStatus() {
            try {
                const res = await fetch(`/api/auth/user/${session.id}`);
                const data = await res.json();
                
                if (data.user && data.user.verified === false) {
                    window.location.href = `/verify.html?id=${session.id}`;
                } else {
                    document.documentElement.classList.add('authorized');
                    document.body.style.visibility = 'visible';
                    loadUsers();
                }
            } catch (e) { 
                window.location.replace('/404.html'); 
            }
        }

        async function loadUsers() {
            const body = document.getElementById('user-table-body');
            body.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-gray-500 animate-pulse uppercase font-black">Cargando DB...</td></tr>';
            try {
                const res = await fetch(`/api/admin/users`);
                const data = await res.json();
                document.getElementById('total-users-count').innerText = data.total || 0;
                renderTable(data.users || []);
            } catch (e) { console.error(e); }
        }

        function renderTable(users) {
            const body = document.getElementById('user-table-body');
            if (!users.length) {
                body.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-gray-600 font-bold uppercase">Sin Resultados</td></tr>';
                return;
            }
            body.innerHTML = users.map(u => {
                const isSuperAdmin = u.email === SUPER_ADMIN_EMAIL;
                const canEdit = session.email === SUPER_ADMIN_EMAIL || !isSuperAdmin;

                return `
                <tr class="hover:bg-white/[0.03] transition-all">
                    <td class="p-5">
                        <div class="font-black ${isSuperAdmin ? 'text-yellow-500' : 'text-white'} text-base">${u.username}</div>
                        <div class="text-[10px] text-gray-500 font-mono tracking-tighter uppercase">${u.email}</div>
                    </td>
                    <td class="p-5">
                        <span class="text-[9px] font-black px-3 py-1 rounded-lg ${u.verified ? 'badge-verified' : 'badge-pending'}">
                            ${u.verified ? 'VERIFICADO' : 'PENDIENTE'}
                        </span>
                    </td>
                    <td class="p-5 text-xs font-black text-pink-500">${u.requests_today} / ${u.limit}</td>
                    <td class="p-5 text-center">
                        ${canEdit ? 
                            `<button onclick="openEdit('${u.id}')" class="bg-white/5 hover:bg-white/10 hover:text-[#ff2d55] w-11 h-11 rounded-2xl transition-all border border-white/5">
                                <i class="fas fa-user-cog text-xs"></i>
                            </button>` : 
                            `<i class="fas fa-lock text-gray-600"></i>`
                        }
                    </td>
                </tr>`;
            }).join('');
        }

        async function openEdit(id) {
            try {
                const res = await fetch(`/api/admin/search?q=${id}`);
                const data = await res.json();
                const u = data.users.find(user => String(user.id) === id);
                
                if (u.email === SUPER_ADMIN_EMAIL && session.email !== SUPER_ADMIN_EMAIL) {
                    return Swal.fire('Acceso Denegado', 'No puedes gestionar al Super Admin.', 'error');
                }

                document.getElementById('edit-id').value = u.id;
                document.getElementById('edit-username').value = u.username;
                document.getElementById('edit-email').value = u.email;
                document.getElementById('edit-role').value = u.role;
                document.getElementById('edit-limit').value = u.limit;

                // LOGICA DEL BOTÓN ELIMINAR
                const deleteZone = document.getElementById('delete-zone');
                if (u.email === SUPER_ADMIN_EMAIL) {
                    deleteZone.innerHTML = ''; 
                } else {
                    deleteZone.innerHTML = `
                        <button type="button" onclick="deleteUserByAdmin('${u.id}')" class="w-full border border-red-500/30 text-red-500 p-3 rounded-xl font-black text-[9px] uppercase tracking-widest hover:bg-red-500 hover:text-white transition-all mb-2">
                            <i class="fas fa-trash-alt mr-2"></i> Eliminar Cuenta
                        </button>
                    `;
                }

                document.getElementById('editModal').classList.replace('hidden', 'flex');
            } catch (e) { Swal.fire('Error', 'No se pudo cargar el usuario', 'error'); }
        }

        async function deleteUserByAdmin(targetId) {
            const result = await Swal.fire({
                title: '¿CONFIRMAR ELIMINACIÓN?',
                text: "Esta cuenta será borrada permanentemente de la base de datos.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ff2d55',
                confirmButtonText: 'SÍ, BORRAR',
                cancelButtonText: 'CANCELAR',
                background: '#161625',
                color: '#fff'
            });

            if (result.isConfirmed) {
                const res = await fetch('/api/admin/delete-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminId: session.id, targetId: targetId })
                });
                if ((await res.json()).status) {
                    Swal.fire('Éxito', 'Usuario eliminado.', 'success');
                    closeModal();
                    loadUsers();
                }
            }
        }

        document.getElementById('editForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                const res = await fetch('/api/admin/update-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        adminId: session.id,
                        targetId: document.getElementById('edit-id').value,
                        username: document.getElementById('edit-username').value,
                        email: document.getElementById('edit-email').value,
                        role: document.getElementById('edit-role').value,
                        limit: parseInt(document.getElementById('edit-limit').value)
                    })
                });
                if ((await res.json()).status) { 
                    Swal.fire('Actualizado', 'Cambios guardados.', 'success');
                    closeModal(); 
                    loadUsers(); 
                }
            } catch (e) { Swal.fire('Error', 'Fallo al conectar', 'error'); }
        };

        function closeModal() { document.getElementById('editModal').classList.replace('flex', 'hidden'); }

        async function searchUser() {
            const q = document.getElementById('searchQuery').value;
            if(!q) return loadUsers();
            const res = await fetch(`/api/admin/search?q=${q}`);
            const data = await res.json();
            renderTable(data.users || []);
        }

        window.onload = checkAdminStatus;
    </script>
</body>
</html>
