<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kazuma | Staff Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --neon-pink: #ff2d55;
            --neon-blue: #00f3ff;
            --dark-bg: #0d0d0d;
            --card-bg: #1a1a2e;
        }
        body { background-color: var(--dark-bg); color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(26, 26, 46, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .input-dark { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: white; }
        .table-container { overflow-x: auto; }
        tr { border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d0d0d; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-pink); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="p-4 border-b border-white/5 flex justify-between items-center sticky top-0 bg-[#0d0d0d] z-50">
        <div class="font-bold text-xl uppercase tracking-tighter">KAZUMA <span class="text-[#ff2d55]">STAFF</span></div>
        <button onclick="location.href='/index.html'" class="text-sm bg-white/10 px-4 py-2 rounded-lg hover:bg-white/20 transition">
            <i class="fas fa-arrow-left mr-2"></i> Dashboard
        </button>
    </header>

    <main class="container mx-auto p-4 flex-grow">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 mt-4">
            <div class="glass p-6 rounded-2xl border-l-4 border-[#ff2d55] flex justify-between items-center">
                <div>
                    <p class="text-xs text-gray-400 uppercase font-bold tracking-widest">Usuarios Registrados</p>
                    <h3 id="total-users-count" class="text-4xl font-black text-white mt-1">0</h3>
                </div>
                <div class="bg-pink-500/10 p-4 rounded-xl">
                    <i class="fas fa-users text-[#ff2d55] text-2xl"></i>
                </div>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="flex-grow flex gap-2">
                <input type="text" id="searchQuery" class="input-dark w-full p-4 rounded-2xl outline-none focus:border-[#ff2d55] transition-all text-white" placeholder="Buscar por Nombre, Correo o ID...">
                <button onclick="searchUser()" class="bg-[#ff2d55] px-7 rounded-2xl font-bold shadow-lg shadow-pink-500/20 hover:scale-105 active:scale-95 transition">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div class="flex gap-2">
                <button onclick="loadUsers('all')" class="bg-blue-600/20 text-blue-400 border border-blue-600/30 px-5 py-2 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-blue-600/30 transition">Todos</button>
                <button onclick="loadUsers('admins')" class="bg-yellow-600/20 text-yellow-400 border border-yellow-600/30 px-5 py-2 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-yellow-600/30 transition">Admins</button>
            </div>
        </div>

        <div class="glass rounded-3xl overflow-hidden border border-white/5 shadow-2xl">
            <div class="table-container">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-white/5 text-[10px] uppercase tracking-widest text-gray-400">
                        <tr>
                            <th class="p-5 font-black">Usuario / Email</th>
                            <th class="p-5 font-black">Rango</th>
                            <th class="p-5 font-black">Consumo Diario</th>
                            <th class="p-5 text-center font-black">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body" class="text-sm">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="editModal" class="fixed inset-0 bg-black/95 hidden items-center justify-center z-[9999] p-4 backdrop-blur-md">
        <div class="glass p-8 rounded-[2.5rem] max-w-md w-full relative border border-white/10 text-white">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-gray-500 hover:text-white transition">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h2 class="text-2xl font-black mb-6 text-[#ff2d55] tracking-tighter">EDITAR PERFIL</h2>

            <form id="editForm" class="space-y-5">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="text-[10px] text-gray-500 uppercase font-black block mb-2 tracking-widest">Nombre de Usuario</label>
                    <input type="text" id="edit-username" class="input-dark w-full p-4 rounded-2xl outline-none focus:border-[#ff2d55]">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] text-gray-500 uppercase font-black block mb-2 tracking-widest">Rango</label>
                        <select id="edit-role" class="input-dark w-full p-4 rounded-2xl outline-none appearance-none cursor-pointer">
                            <option value="user">USER</option>
                            <option value="admin">ADMIN</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-500 uppercase font-black block mb-2 tracking-widest">Plan</label>
                        <select id="edit-plan" class="input-dark w-full p-4 rounded-2xl outline-none appearance-none cursor-pointer" onchange="toggleLimitInput()">
                            <option value="100">FREE (100)</option>
                            <option value="1000">PLAN 1 (1k)</option>
                            <option value="4000">PLAN 2 (4k)</option>
                            <option value="custom">CUSTOM</option>
                        </select>
                    </div>
                </div>
                <div id="custom-limit-div" class="hidden">
                    <label class="text-[10px] text-yellow-500 uppercase font-black block mb-2 tracking-widest">Límite Manual</label>
                    <input type="number" id="edit-limit" class="input-dark w-full p-4 rounded-2xl outline-none border-yellow-500/30">
                </div>
                <button type="submit" class="w-full bg-[#ff2d55] p-5 rounded-2xl font-black mt-4 shadow-xl shadow-pink-500/20 hover:brightness-110 active:scale-95 transition-all uppercase tracking-widest">
                    Guardar Cambios
                </button>
            </form>
        </div>
    </div>

    <script>
        const session = JSON.parse(localStorage.getItem('userSession'));
        if (!session || session.role !== 'admin') window.location.href = '/index.html';

        async function loadUsers(filter = 'all') {
            const body = document.getElementById('user-table-body');
            const counter = document.getElementById('total-users-count');
            body.innerHTML = '<tr><td colspan="4" class="p-16 text-center text-gray-500 animate-pulse font-black tracking-widest">ACCEDIENDO A LA DB...</td></tr>';

            try {
                const res = await fetch(`/api/admin/users?filter=${filter}`);
                const data = await res.json();
                
                const users = data.users || [];
                // Usamos data.total del backend para el contador global
                counter.innerText = data.total || users.length;
                renderTable(users);
            } catch (e) {
                body.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-red-500 font-bold uppercase">Error de conexión</td></tr>';
            }
        }

        async function searchUser() {
            const q = document.getElementById('searchQuery').value;
            if(!q) return loadUsers();
            try {
                const res = await fetch(`/api/admin/search?q=${q}`);
                const data = await res.json();
                renderTable(data.users || []);
            } catch (e) { console.error(e); }
        }

        function renderTable(users) {
            const body = document.getElementById('user-table-body');
            if (!users || users.length === 0) {
                body.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-gray-600 font-bold">SIN REGISTROS COINCIDENTES</td></tr>';
                return;
            }
            body.innerHTML = users.map(u => {
                const progress = Math.min(((u.requests_today || 0) / (u.limit || 1)) * 100, 100);
                // Convertimos el ID a String para evitar problemas en el HTML
                const userId = String(u.id);

                return `
                <tr class="hover:bg-white/[0.03] transition-all">
                    <td class="p-5">
                        <div class="font-black text-white text-base">${u.username}</div>
                        <div class="text-[10px] text-gray-500 font-mono tracking-tighter uppercase">${u.email}</div>
                    </td>
                    <td class="p-5">
                        <span class="text-[9px] font-black px-3 py-1 rounded-lg ${u.role === 'admin' ? 'bg-yellow-500/10 text-yellow-500 border border-yellow-500/20' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'}">
                            ${u.role.toUpperCase()}
                        </span>
                    </td>
                    <td class="p-5">
                        <div class="flex items-center gap-3">
                            <div class="text-xs font-black text-pink-500 whitespace-nowrap">${u.requests_today} / ${u.limit}</div>
                            <div class="hidden md:block w-full max-w-[80px] h-1.5 bg-white/5 rounded-full overflow-hidden">
                                <div class="h-full bg-pink-500" style="width: ${progress}%"></div>
                            </div>
                        </div>
                    </td>
                    <td class="p-5 text-center">
                        <button onclick="openEdit('${userId}')" class="bg-white/5 hover:bg-white/10 hover:text-[#ff2d55] w-11 h-11 rounded-2xl transition-all border border-white/5">
                            <i class="fas fa-user-cog text-xs"></i>
                        </button>
                    </td>
                </tr>`;
            }).join('');
        }

        async function openEdit(id) {
            try {
                // Buscamos al usuario para cargar los datos en el modal
                const res = await fetch(`/api/admin/search?q=${id}`);
                const data = await res.json();
                const u = data.users.find(user => String(user.id) === id);

                if(!u) return alert("Usuario no encontrado");

                document.getElementById('edit-id').value = u.id;
                document.getElementById('edit-username').value = u.username;
                document.getElementById('edit-role').value = u.role;

                const select = document.getElementById('edit-plan');
                if([100, 1000, 4000].includes(u.limit)) {
                    select.value = u.limit;
                } else {
                    select.value = 'custom';
                    document.getElementById('edit-limit').value = u.limit;
                }

                toggleLimitInput();
                document.getElementById('editModal').classList.replace('hidden', 'flex');
            } catch (e) { alert("Error al abrir edición"); }
        }

        function toggleLimitInput() {
            const val = document.getElementById('edit-plan').value;
            document.getElementById('custom-limit-div').classList.toggle('hidden', val !== 'custom');
        }

        document.getElementById('editForm').onsubmit = async (e) => {
            e.preventDefault();
            const planVal = document.getElementById('edit-plan').value;
            const limit = planVal === 'custom' ? parseInt(document.getElementById('edit-limit').value) : parseInt(planVal);

            try {
                const res = await fetch('/api/admin/update-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        adminId: session.id,
                        targetId: document.getElementById('edit-id').value,
                        username: document.getElementById('edit-username').value,
                        role: document.getElementById('edit-role').value,
                        limit: limit
                    })
                });
                const data = await res.json();
                if(data.status) { 
                    closeModal(); 
                    loadUsers(); 
                } else { 
                    alert(data.message); 
                }
            } catch (e) { alert("Error al guardar cambios"); }
        };

        function closeModal() { document.getElementById('editModal').classList.replace('flex', 'hidden'); }

        window.onload = loadUsers;
    </script>
</body>
</html>
