<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAZUMA | Global Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --neon-pink: #ff2d55; 
            --neon-blue: #00f3ff; 
            --dark-bg: #050505;
            --card-bg: #161625;
        }

        body { 
            background-color: #000000 !important; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
        }

        /* --- ESTILOS DE TU DASH --- */
        .neon-text-pink { color: var(--neon-pink); text-shadow: 0 0 10px rgba(255, 45, 85, 0.5); }
        .hero-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 45, 85, 0.05) 0%, transparent 60%);
            z-index: -1;
        }

        /* --- LÓGICA DE MENSAJES --- */
        #chat-screen { display: none; flex-direction: column; height: 100vh; }
        #main-hub { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }

        .chat-container {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
            background: rgba(255, 255, 255, 0.02);
        }

        /* Mensaje MÍO (Derecha) */
        .msg-me {
            align-self: flex-end; max-width: 80%;
        }
        .msg-me .bubble {
            background: var(--neon-pink);
            color: #000; font-weight: 700;
            padding: 12px 18px; border-radius: 20px 20px 0 20px;
            box-shadow: 0 4px 15px rgba(255, 45, 85, 0.3);
            font-size: 0.9rem;
        }

        /* Mensaje OTROS (Izquierda) */
        .msg-others {
            align-self: flex-start; max-width: 80%;
            display: flex; gap: 10px;
        }
        .msg-others .bubble {
            background: var(--card-bg);
            color: white; border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 12px 18px; border-radius: 20px 20px 20px 0;
            font-size: 0.9rem;
        }
        .user-tag { font-size: 0.7rem; font-weight: 900; color: var(--neon-blue); margin-bottom: 4px; text-transform: uppercase; }

        .avatar {
            width: 35px; height: 35px; border-radius: 10px;
            background: var(--neon-blue); color: black;
            display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem;
        }

        /* Input Area */
        .input-area {
            background: #0a0a0a; border-top: 1px solid rgba(255,255,255,0.1);
            padding: 15px; display: flex; gap: 10px;
        }
        .input-area input {
            flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; padding: 12px 20px; color: white; outline: none;
        }
        .input-area input:focus { border-color: var(--neon-blue); }
        
        .btn-send {
            background: var(--neon-pink); width: 50px; height: 50px;
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
        }

        /* Hub Card */
        .hub-card {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1);
            padding: 30px; border-radius: 30px; text-align: center; width: 100%; max-width: 350px;
        }
    </style>
</head>
<body>
    <div class="hero-gradient"></div>

    <div id="main-hub">
        <div class="hub-card">
            <div class="w-20 h-20 bg-pink-500/20 rounded-3xl flex items-center justify-center mx-auto mb-6 border border-pink-500/30">
                <i class="fas fa-globe neon-text-pink text-3xl"></i>
            </div>
            <h2 class="text-xl font-black mb-2">KAZUMA GLOBAL</h2>
            <p class="text-gray-400 text-xs mb-8 font-medium">Conéctate con la infraestructura y otros desarrolladores.</p>
            <button onclick="enterChat()" class="w-full py-4 bg-[#ff2d55] rounded-2xl font-black text-sm uppercase tracking-widest shadow-lg shadow-pink-500/20">
                Entrar al Chat
            </button>
        </div>
        <a href="/dash" class="mt-8 text-[10px] font-bold text-gray-500 uppercase tracking-widest">Volver al Dashboard</a>
    </div>

    <div id="chat-screen">
        <nav class="px-6 py-4 flex items-center gap-4 bg-black/80 border-b border-white/10">
            <button onclick="exitChat()"><i class="fas fa-chevron-left"></i></button>
            <div class="text-lg font-black tracking-tighter">GLOBAL <span class="neon-text-pink">CHAT</span></div>
        </nav>

        <div class="chat-container" id="messages">
            </div>

        <div class="input-area">
            <input type="text" id="chat-input" placeholder="Escribe un mensaje...">
            <button class="btn-send" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        // 1. LÓGICA DE SESIÓN (TOMADA DE TU DASH)
        const user = JSON.parse(localStorage.getItem('userSession'));
        if (!user) window.location.href = '/login';

        const chatScreen = document.getElementById('chat-screen');
        const mainHub = document.getElementById('main-hub');
        const messageContainer = document.getElementById('messages');
        const chatInput = document.getElementById('chat-input');

        function enterChat() {
            mainHub.style.display = 'none';
            chatScreen.style.display = 'flex';
            // Scroll al fondo
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        function exitChat() {
            chatScreen.style.display = 'none';
            mainHub.style.display = 'flex';
        }

        // 2. LÓGICA DE MENSAJERÍA
        function sendMessage() {
            const text = chatInput.value.trim();
            if (text === "") return;

            // Crear mensaje propio (Derecha, Rosado)
            appendMessage({
                username: user.username,
                text: text,
                isMe: true
            });

            chatInput.value = "";
            
            // SIMULACIÓN: Un bot responde para que veas cómo se ve el lado izquierdo
            setTimeout(() => {
                appendMessage({
                    username: "Kazuma_System",
                    text: "Mensaje global recibido. Protocolo activo. 😈",
                    isMe: false
                });
            }, 1000);
        }

        function appendMessage(data) {
            const msgDiv = document.createElement('div');
            msgDiv.className = data.isMe ? 'msg-me' : 'msg-others';

            if (data.isMe) {
                msgDiv.innerHTML = `<div class="bubble">${data.text}</div>`;
            } else {
                const initial = data.username.charAt(0).toUpperCase();
                msgDiv.innerHTML = `
                    <div class="avatar">${initial}</div>
                    <div>
                        <div class="user-tag">${data.username}</div>
                        <div class="bubble">${data.text}</div>
                    </div>
                `;
            }

            messageContainer.appendChild(msgDiv);
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        // Enviar con Enter
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
