<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAZUMA AI | Neural Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --neon-pink: #ff2d55; --neon-blue: #00f3ff; --dark-bg: #050505; }

        body { 
            background-color: #000000 !important; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
        }

        .neon-text-blue { color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 243, 255, 0.8); }
        .neon-text-pink { color: var(--neon-pink); text-shadow: 0 0 10px rgba(255, 45, 85, 0.8); }

        .hero-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 45, 85, 0.08) 0%, transparent 60%),
                        radial-gradient(circle at 0% 0%, rgba(0, 243, 255, 0.05) 0%, transparent 40%);
            z-index: -1;
        }

        /* Scanline igual a tu web principal */
        .scanline {
            width: 100%; height: 2px; background: var(--neon-blue); opacity: 0.05;
            position: absolute; animation: scan 4s linear infinite; z-index: 10;
            pointer-events: none;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        /* Contenedor de mensajes vacío */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            margin-top: 70px;
            margin-bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Barra de navegación estilo KAZUMA */
        nav {
            background: rgba(0, 0, 0, 0.9);
            backdrop-blur: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Input de texto */
        .input-area {
            background: rgba(10, 10, 10, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .custom-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .btn-send {
            background: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 45, 85, 0.4);
            transition: transform 0.2s;
        }

        .btn-send:active { transform: scale(0.9); }

        /* Estilo para cuando añadas mensajes (opcional) */
        .msg-empty-state {
            margin: auto;
            text-align: center;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="hero-gradient"></div>
    <div class="scanline"></div>

    <nav class="fixed top-0 w-full z-50 px-6 py-4 flex justify-between items-center">
        <div class="text-xl font-black tracking-tighter">KAZUMA <span class="neon-text-pink">AI</span></div>
        <div class="flex items-center gap-2">
            <span class="text-[9px] font-black uppercase tracking-widest text-blue-400">Neural Link</span>
            <div class="w-2 h-2 rounded-full bg-blue-400 animate-pulse shadow-[0_0_8px_#60a5fa]"></div>
        </div>
    </nav>

    <main id="chat-container">
        <div class="msg-empty-state">
            <i class="fas fa-robot text-4xl mb-4 block neon-text-blue"></i>
            <p class="text-[10px] font-black uppercase tracking-[0.3em]">Esperando Directivas...</p>
        </div>
    </main>

    <div class="input-area fixed bottom-0 w-full p-4 z-50">
        <div class="max-w-2xl mx-auto flex gap-3">
            <input type="text" 
                   id="user-input" 
                   placeholder="Escribe al núcleo de la IA..." 
                   class="custom-input flex-1 py-4 px-6 rounded-2xl text-sm font-medium">
            
            <button id="send-btn" class="btn-send w-14 h-14 rounded-2xl flex items-center justify-center text-white">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        const input = document.getElementById('user-input');
        const btn = document.getElementById('send-btn');

        btn.onclick = () => {
            if(input.value.trim() !== "") {
                console.log("Comando enviado al núcleo: " + input.value);
                input.value = ""; // Limpia pero nadie responde
            }
        }

        input.onkeypress = (e) => {
            if(e.key === 'Enter') btn.onclick();
        }
    </script>
</body>
</html>
