<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAZUMA | Global Neural Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --neon-pink: #ff2d55; --neon-blue: #00f3ff; --dark-bg: #050505; }

        body { 
            background-color: #000000 !important; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Evita que la web completa se desplace */
        }

        .neon-text-pink { color: var(--neon-pink); text-shadow: 0 0 10px rgba(255, 45, 85, 0.5); }
        
        /* --- ESTADO INICIAL: LISTA TIPO WHATSAPP --- */
        #main-hub { height: 100vh; display: flex; flex-direction: column; }
        
        .chat-item {
            background: rgba(20, 20, 30, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        /* --- PANTALLA DE CHAT --- */
        #chat-screen { 
            display: none; 
            flex-direction: column; 
            height: 100vh; 
            position: relative;
        }

        /* SCROLL SOLO PARA MENSAJES */
        #messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 100px; /* Espacio para que el último mensaje no tape el input */
        }

        /* BURBUJAS SEGÚN TU ESPECIFICACIÓN */
        .msg-me { align-self: flex-end; max-width: 85%; }
        .msg-me .bubble {
            background: var(--neon-pink);
            color: #000; font-weight: 800; /* Texto negro sobre rosa */
            padding: 12px 16px; border-radius: 18px 18px 2px 18px;
            font-size: 0.9rem; line-height: 1.4;
        }

        .msg-others { align-self: flex-start; max-width: 85%; }
        .msg-others .bubble {
            background: #1a1a1a;
            color: #fff; border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 12px 16px; border-radius: 18px 18px 18px 2px;
            font-size: 0.9rem;
        }

        .user-name { font-size: 0.65rem; font-weight: 900; color: var(--neon-blue); text-transform: uppercase; margin-bottom: 4px; }

        /* BARRA DE ENTRADA FIJA ABAJO */
        .input-wrapper {
            position: absolute;
            bottom: 0; width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div id="main-hub">
        <nav class="p-6 border-b border-white/10 flex justify-between items-center bg-black">
            <div class="text-xl font-black tracking-tighter">KAZUMA <span class="neon-text-pink">MESSAGES</span></div>
            <i class="fas fa-ellipsis-v text-gray-500"></i>
        </nav>
        
        <div class="flex-1 overflow-y-auto">
            <div class="chat-item p-5 flex items-center gap-4 cursor-pointer" onclick="enterChat()">
                <div class="w-14 h-14 rounded-2xl bg-pink-500/20 flex items-center justify-center border border-pink-500/30">
                    <i class="fas fa-globe neon-text-pink text-xl"></i>
                </div>
                <div class="flex-1">
                    <div class="flex justify-between items-center mb-1">
                        <h3 class="font-black text-sm uppercase tracking-tight">Kazuma Global</h3>
                        <span class="text-[9px] text-gray-500 font-bold">ACTIVO</span>
                    </div>
                    <p class="text-xs text-gray-400 truncate font-medium">Red neuronal de usuarios conectados...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-screen">
        <nav class="p-4 border-b border-white/10 flex items-center gap-4 bg-black z-50">
            <button onclick="exitChat()"><i class="fas fa-arrow-left"></i></button>
            <div>
                <h2 class="text-sm font-black uppercase">Kazuma Global</h2>
                <p class="text-[8px] font-bold text-blue-400 uppercase tracking-widest">Network Online</p>
            </div>
        </nav>

        <div id="messages-container">
            </div>

        <div class="input-wrapper">
            <div class="max-w-2xl mx-auto flex gap-3">
                <input type="text" id="chat-input" placeholder="Escribir mensaje..." 
                       class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-400 transition-all">
                <button onclick="sendMessage()" class="w-12 h-12 bg-[#ff2d55] rounded-xl flex items-center justify-center shadow-lg shadow-pink-500/30">
                    <i class="fas fa-paper-plane text-white"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // LÓGICA DE TU DASHBOARD
        const userSession = JSON.parse(localStorage.getItem('userSession'));
        if (!userSession) window.location.href = '/login';

        const hub = document.getElementById('main-hub');
        const chat = document.getElementById('chat-screen');
        const container = document.getElementById('messages-container');
        const input = document.getElementById('chat-input');

        function enterChat() {
            hub.style.display = 'none';
            chat.style.display = 'flex';
            container.scrollTop = container.scrollHeight;
        }

        function exitChat() {
            chat.style.display = 'none';
            hub.style.display = 'flex';
        }

        function sendMessage() {
            const text = input.value.trim();
            if(!text) return;

            // 1. Mostrar mi mensaje inmediatamente (Local)
            appendMessage(userSession.username, text, true);
            
            // 2. LOGICA BACKEND: Aquí enviarías el mensaje a tu servidor
            // fetch('/api/chat/send', { method: 'POST', body: JSON.stringify({ user: userSession.id, msg: text }) });

            input.value = "";
        }

        function appendMessage(name, text, isMe) {
            const div = document.createElement('div');
            div.className = isMe ? 'msg-me' : 'msg-others';
            
            if(isMe) {
                div.innerHTML = `<div class="bubble">${text}</div>`;
            } else {
                div.innerHTML = `
                    <div class="user-name">${name}</div>
                    <div class="bubble">${text}</div>
                `;
            }
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        input.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

        // SIMULACIÓN DE RECEPCIÓN GLOBAL (Lo que verían otros usuarios)
        // En producción, esto vendría de un evento de tu Backend
        function receiveGlobalMessage(sender, message) {
            if(sender !== userSession.username) {
                appendMessage(sender, message, false);
            }
        }
    </script>
</body>
</html>
