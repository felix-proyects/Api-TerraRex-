<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Api Kazuma | Dashboard</title>
    
    <script>
        if (!localStorage.getItem('userSession')) {
            window.location.href = '/login';
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --neon-pink: #ff2d55;
            --neon-blue: #00f3ff;
            --dark-bg: #0d0d0d;
            --card-bg: #161625;
            --sidebar-bg: #121212;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --code-bg: #212135;
        }
        
        /* Pantalla de seguridad negra */
        #safety-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: block;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark-bg); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .spinner {
            width: 50px; height: 50px; border: 3px solid rgba(0, 243, 255, 0.1);
            border-top: 3px solid var(--neon-blue); border-radius: 50%;
            animation: spin 1s linear infinite; box-shadow: 0 0 15px var(--neon-blue);
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        header {
            background-color: var(--sidebar-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky; top: 0; z-index: 1000;
        }

        .brand { font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; }
        .brand span { color: var(--neon-pink); }

        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; box-sizing: border-box; flex-grow: 1; }
        
        .api-card {
            background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Estilo para la API KEY (Basado en Mitzuki API) */
        .key-container {
            background: #080810; border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 15px; border-radius: 15px; display: flex;
            align-items: center; justify-content: space-between; margin-top: 10px;
        }
        .key-text { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--neon-blue); overflow: hidden; text-overflow: ellipsis; }
        .copy-btn { color: var(--text-muted); cursor: pointer; transition: 0.3s; }
        .copy-btn:hover { color: var(--neon-blue); }

        /* Gráfica */
        .chart-container { width: 100%; height: 200px; margin-top: 15px; }

        .nav-category { color: var(--neon-blue); font-size: 0.7rem; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1.5px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-box { 
            background: var(--code-bg); padding: 15px; border-radius: 18px; 
            border-left: 4px solid var(--neon-blue);
        }
        .stat-value { font-size: 1.1rem; font-weight: 900; font-family: 'JetBrains Mono', monospace; }

        .sidebar {
            position: fixed; top: 0; right: -100%; width: 85%; max-width: 300px; height: 100%;
            background: var(--sidebar-bg); transition: 0.3s ease-in-out; z-index: 2000;
            padding: 30px 20px; box-sizing: border-box; overflow-y: auto;
        }
        .sidebar.active { right: 0; }
        .sidebar-link {
            display: flex; align-items: center; gap: 15px; color: var(--text-main);
            text-decoration: none; padding: 14px; border-radius: 12px; margin-bottom: 8px;
            background: rgba(255,255,255,0.03); cursor: pointer; font-size: 0.9rem; font-weight: 600;
        }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 1500; backdrop-filter: blur(4px); }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <div id="safety-overlay"></div>

    <div id="preloader">
        <div class="spinner"></div>
        <div class="loading-text" style="color: var(--neon-blue); margin-top: 20px; font-weight: 900;">Cargando...</div>
    </div>

    <header>
        <div class="brand">KAZUMA <span>DASH</span></div>
        <div class="hamburger" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="sidebar" id="sidebar">
        <div style="text-align: right; margin-bottom: 20px;" onclick="toggleMenu()"><i class="fas fa-times"></i></div>
        <p class="nav-category">Menú Principal</p>
        <div class="sidebar-link" onclick="location.reload()"><i class="fas fa-th-large"></i> Dashboard</div>
        <div class="sidebar-link" onclick="location.href='/profile'"><i class="fas fa-user-circle"></i> Mi Perfil</div>
        <div class="sidebar-link" style="margin-top:30px; background: rgba(255,45,85,0.1); color:var(--neon-pink);" onclick="logout()"><i class="fas fa-power-off"></i> Cerrar Sesión</div>
    </nav>

    <div class="container" id="content-area">
        <div class="api-card">
            <p class="nav-category"><i class="fas fa-key"></i> Mi API KEY</p>
            <div class="key-container">
                <span id="apiKeyDisplay" class="key-text">sk-loading...</span>
                <i class="fas fa-copy copy-btn" onclick="copyKey()"></i>
            </div>
        </div>

        <div class="api-card">
            <p class="nav-category"><i class="fas fa-chart-area"></i> Actividad de tu API</p>
            <div class="stats-grid">
                <div class="stat-box">
                    <div style="font-size: 0.6rem; color: var(--text-muted);">HOY</div>
                    <div id="reqToday" class="stat-value">0</div>
                </div>
                <div class="stat-box" style="border-left-color: var(--neon-pink);">
                    <div style="font-size: 0.6rem; color: var(--text-muted);">RESTANTES</div>
                    <div id="reqLimit" class="stat-value">∞</div>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="activityChart"></canvas>
            </div>
        </div>

        <div id="dynamic-content"></div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('userSession'));

        window.onload = () => {
            // Quitar el bloqueo negro solo si hay sesión
            if (user) {
                document.getElementById('safety-overlay').style.display = 'none';
                document.getElementById('apiKeyDisplay').innerText = user.apiKey || 'No generada';
                initDashboard();
            }
        };

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }

        function copyKey() {
            const key = document.getElementById('apiKeyDisplay').innerText;
            navigator.clipboard.writeText(key);
            alert('API Key copiada al portapapeles');
        }

        async function initDashboard() {
            try {
                const res = await fetch('/api/stats/global');
                const stats = await res.json();
                
                // Actualizar contadores rápidos
                document.getElementById('reqToday').innerText = stats.userToday || 0;

                // Inicializar Gráfica (Datos de ejemplo basados en tu foto)
                const ctx = document.getElementById('activityChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['L', 'M', 'X', 'J', 'V', 'S', 'D'],
                        datasets: [{
                            label: 'Requests',
                            data: [12, 19, 3, 5, 2, 3, 0],
                            borderColor: '#00f3ff',
                            backgroundColor: 'rgba(0, 243, 255, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 5,
                            pointBackgroundColor: '#00f3ff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { display: false },
                            x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#a0a0a0' } }
                        }
                    }
                });

                // Cargar el resto del contenido que ya tenías
                document.getElementById('dynamic-content').innerHTML = `
                    <div class="api-card">
                        <p class="nav-category">Global Stats</p>
                        <div class="stats-grid">
                            <div class="stat-box">
                                <div style="font-size: 0.6rem; color: var(--text-muted);">USUARIOS</div>
                                <div class="stat-value">${stats.totalUsers}</div>
                            </div>
                            <div class="stat-box">
                                <div style="font-size: 0.6rem; color: var(--text-muted);">TOTAL REQS</div>
                                <div class="stat-value">${stats.totalRequests}</div>
                            </div>
                        </div>
                    </div>
                `;

                // Quitar preloader
                setTimeout(() => {
                    document.getElementById('preloader').style.opacity = '0';
                    setTimeout(() => { document.getElementById('preloader').style.display = 'none'; }, 500);
                }, 1000);

            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
