<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Api Kazuma | Dashboard</title>
    
    <script>
        if (!localStorage.getItem('userSession')) {
            window.location.href = '/login';
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --neon-pink: #ff2d55;
            --neon-blue: #00f3ff;
            --dark-bg: #0d0d0d;
            --card-bg: #161625;
            --sidebar-bg: #121212;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --code-bg: #212135;
            /* Nuevos colores para gráfica y footer */
            --chart-fill: rgba(0, 243, 255, 0.05);
            --chart-point: #00f3ff;
            --footer-text: #a0a0a0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #safety-block {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10001; display: block;
        }

        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark-bg); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .spinner {
            width: 50px; height: 50px; border: 3px solid rgba(0, 243, 255, 0.1);
            border-top: 3px solid var(--neon-blue); border-radius: 50%;
            animation: spin 1s linear infinite; box-shadow: 0 0 15px var(--neon-blue);
        }

        header {
            background-color: var(--sidebar-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky; top: 0; z-index: 1000;
        }

        .brand { font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; cursor: pointer; }
        .brand span { color: var(--neon-pink); }

        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; box-sizing: border-box; flex-grow: 1; }
        
        .api-card {
            background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* ESTILO PARA LA KEY CON OJO (INTACTO) */
        .key-container {
            background: #080810; border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 15px; border-radius: 15px; display: flex;
            align-items: center; justify-content: space-between; margin-top: 10px;
        }
        .key-text { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--neon-blue); text-overflow: ellipsis; overflow: hidden; white-space: nowrap; width: 70%; }
        .key-actions { display: flex; gap: 12px; color: var(--text-muted); cursor: pointer; }

        /* GRÁFICA (TAMAÑO FOTO) */
        .chart-container { width: 100%; height: 200px; margin-top: 15px; }

        .nav-category { color: var(--neon-blue); font-size: 0.7rem; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1.5px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-box { 
            background: var(--code-bg); padding: 15px; border-radius: 18px; 
            border-left: 4px solid var(--neon-blue); position: relative;
        }
        .stat-value { font-size: 1.1rem; font-weight: 900; font-family: 'JetBrains Mono', monospace; }

        /* FOOTER (NUEVO ESTILO INM DIEGO) */
        .new-footer {
            background-color: var(--sidebar-bg);
            padding: 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            font-size: 0.75rem;
            color: var(--footer-text);
            margin-top: auto;
        }
        .footer-brand {
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 5px;
        }
        .footer-links {
            display: flex; justify-content: center; gap: 20px;
            margin-top: 15px; font-weight: bold; font-size: 0.7rem;
        }
        .footer-link {
            text-decoration: none; color: var(--text-muted);
            transition: 0.3s;
        }
        .footer-link:hover { color: var(--neon-pink); }
        /* Reset para el preloader y sidebar */
        #safety-block { display: block; }
        #sidebar { position: fixed; top: 0; right: -100%; width: 85%; max-width: 300px; height: 100%; background: var(--sidebar-bg); transition: 0.3s; z-index: 2000; overflow-y: auto; }
        #sidebar.active { right: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 1500; }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <div id="safety-block"></div>

    <div id="preloader">
        <div class="spinner"></div>
        <div class="loading-text" style="color: var(--neon-blue); margin-top: 20px; font-weight: 900;">Cargando...</div>
    </div>

    <header>
        <div class="brand">KAZUMA <span>DASH</span></div>
        <div onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="sidebar" id="sidebar">
        <p class="nav-category">Principal</p>
        <div class="sidebar-link" onclick="location.reload()"><i class="fas fa-th-large"></i> Dashboard</div>
        <div class="sidebar-link" onclick="logout()" style="margin-top:20px; color:var(--neon-pink)"><i class="fas fa-power-off"></i> Salir</div>
    </nav>

    <div class="container" id="content-area">
        <div class="api-card">
            <p class="nav-category"><i class="fas fa-key"></i> Mi API Key</p>
            <div class="key-container">
                <span id="key-display" class="key-text">••••••••••••••••</span>
                <div class="key-actions">
                    <i class="fas fa-eye" id="eye-icon" onclick="toggleKeyView()"></i>
                    <i class="fas fa-copy" onclick="copyKey()"></i>
                </div>
            </div>
        </div>

        <div class="api-card">
            <p class="nav-category"><i class="fas fa-chart-area"></i> Actividad de tu API</p>
            <div class="stats-grid">
                <div class="stat-box">
                    <div style="font-size: 0.6rem; color: var(--text-muted);">HOY</div>
                    <div id="reqToday" class="stat-value">0</div>
                </div>
                <div class="stat-box" style="border-left-color: var(--neon-pink);">
                    <div style="font-size: 0.6rem; color: var(--text-muted);">RESTANTES</div>
                    <div id="reqLimit" class="stat-value">∞</div>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="userChart"></canvas>
            </div>
        </div>

        <div class="api-card">
            <p class="nav-category">Global Stats</p>
            <div class="stats-grid">
                <div class="stat-box">
                    <div style="font-size: 0.6rem; color: var(--text-muted);">USUARIOS</div>
                    <div id="totalUsers" class="stat-value">0</div>
                </div>
                <div class="stat-box">
                    <div style="font-size: 0.6rem; color: var(--text-muted);">TOTAL REQS</div>
                    <div id="totalReqs" class="stat-value">0</div>
                </div>
            </div>
        </div>
    </div>

    <footer class="new-footer">
        <p class="footer-brand">Inm Diego.</p>
        <p>© 2026. Todos los derechos Reservados.</p>
        <div class="footer-links">
            <a href="/channel" class="footer-link"><i class="fab fa-whatsapp"></i> Channel</a>
            <a href="mailto:diego@kazuma.com" class="footer-link"><i class="fas fa-envelope"></i> Email</a>
        </div>
    </footer>

    <script>
        const user = JSON.parse(localStorage.getItem('userSession'));
        let realApiKey = "";

        window.onload = () => {
            if (user) {
                // Quitar bloqueo negro y sidebar
                document.getElementById('safety-block').style.display = 'none';
                initDashboard();
            }
        };

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }

        function copyKey() {
            navigator.clipboard.writeText(realApiKey);
            alert('API Key copiada');
        }

        function toggleKeyView() {
            const el = document.getElementById('key-display');
            const icon = document.getElementById('eye-icon');
            if (el.innerText.includes('••••')) {
                el.innerText = realApiKey;
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                el.innerText = '••••••••••••••••';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        async function initDashboard() {
            try {
                // Llamadas al backend
                const [resUser, resStats] = await Promise.all([
                    fetch(`/api/auth/user/${user.id}`),
                    fetch('/api/stats/global')
                ]);
                const userData = await resUser.json();
                const statsData = await resStats.json();
                
                // Cargar datos
                realApiKey = userData.user.apikey;
                document.getElementById('reqToday').innerText = statsData.userToday || 0;
                document.getElementById('totalUsers').innerText = statsData.totalUsers || 0;
                document.getElementById('totalReqs').innerText = statsData.totalRequests || 0;

                // Inicializar Gráfica (Mismos datos de tu foto)
                const ctx = document.getElementById('userChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['L', 'M', 'X', 'J', 'V', 'S', 'D'],
                        datasets: [{
                            data: [12, 19, 5, 8, 12, 4, 0],
                            borderColor: '#00f3ff',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true,
                            backgroundColor: 'rgba(0, 243, 255, 0.03)',
                            pointRadius: 4,
                            pointBackgroundColor: '#00f3ff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { display: false },
                            x: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#555' } }
                        }
                    }
                });

                // Quitar preloader
                setTimeout(() => {
                    document.getElementById('preloader').style.opacity = '0';
                    setTimeout(() => { document.getElementById('preloader').style.display = 'none'; }, 500);
                }, 1000);

            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
