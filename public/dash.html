<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Api Kazuma | Dashboard</title>
    <script>
        if (!localStorage.getItem('userSession')) window.location.href = '/login';
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --neon-pink: #ff2d55;
            --neon-blue: #00f3ff;
            --dark-bg: #0d0d0d;
            --card-bg: #161625;
            --sidebar-bg: #121212;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --code-bg: #212135;
        }
        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark-bg); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px; height: 50px; border: 3px solid rgba(0, 243, 255, 0.1);
            border-top: 3px solid var(--neon-blue); border-radius: 50%;
            animation: spin 1s linear infinite; box-shadow: 0 0 15px var(--neon-blue);
        }
        header {
            background-color: var(--sidebar-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky; top: 0; z-index: 1000;
        }
        .brand { font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; cursor: pointer; }
        .brand span { color: var(--neon-pink); }
        
        .sidebar {
            position: fixed; top: 0; right: -100%; width: 85%; max-width: 300px; height: 100%;
            background: var(--sidebar-bg); transition: 0.3s ease-in-out; z-index: 2000;
            padding: 30px 20px; box-sizing: border-box; overflow-y: auto;
        }
        .sidebar.active { right: 0; }
        .sidebar-link {
            display: flex; align-items: center; gap: 15px; color: var(--text-main);
            text-decoration: none; padding: 14px; border-radius: 12px; margin-bottom: 8px;
            background: rgba(255,255,255,0.03); cursor: pointer; font-size: 0.9rem;
        }
        .nav-category { color: var(--neon-blue); font-size: 0.7rem; font-weight: 900; text-transform: uppercase; margin: 25px 0 10px 5px; letter-spacing: 1.5px; }

        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        
        .api-card {
            background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* DISEÑO DE KEY CON TU ESENCIA */
        .key-container {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .key-text { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--text-main); }
        .key-actions { display: flex; gap: 15px; color: var(--text-muted); cursor: pointer; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-box { 
            background: var(--code-bg); padding: 15px; border-radius: 18px; 
            border-left: 4px solid var(--neon-blue); position: relative;
        }
        .stat-label { font-size: 0.6rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; }
        .stat-value { font-size: 1.1rem; font-weight: 900; font-family: 'JetBrains Mono', monospace; }

        .user-card {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 18px;
            margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05);
        }
        .rank-badge { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: 900; }
        .rank-1 { background: #fbbf24; color: black; }

        .hero-img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--neon-pink); margin: 0 auto 15px; display: block; object-fit: cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 1500; }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="spinner"></div>
        <div class="loading-text" style="color:var(--neon-blue); margin-top:10px; font-weight:bold;">KAZUMA DASH...</div>
    </div>

    <header>
        <div class="brand" onclick="location.href='/'">KAZUMA <span>DASH</span></div>
        <div onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="sidebar" id="sidebar">
        <div style="text-align: right; margin-bottom: 20px;" onclick="toggleMenu()"><i class="fas fa-times"></i></div>
        <p class="nav-category">Menú Principal</p>
        <div class="sidebar-link" onclick="showCategory('inicio')"><i class="fas fa-th-large"></i> Dashboard</div>
        <div class="sidebar-link" onclick="location.href='/profile'"><i class="fas fa-user-circle"></i> Mi Perfil</div>
        <p class="nav-category">Servicios</p>
        <div class="sidebar-link" onclick="location.href='/endpoints/descargas'"><i class="fas fa-cloud-download-alt"></i> Descargas</div>
        <div class="sidebar-link" style="margin-top:20px; color:var(--neon-pink);" onclick="logout()"><i class="fas fa-power-off"></i> Salir</div>
    </nav>

    <div class="container" id="content-area"></div>

    <script>
        const session = JSON.parse(localStorage.getItem('userSession'));
        let realKey = "";

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function logout() { localStorage.clear(); window.location.href = '/login'; }

        function copyKey() {
            navigator.clipboard.writeText(realKey);
            alert("API KEY COPIADA");
        }

        function toggleKey() {
            const txt = document.getElementById('key-val');
            const eye = document.getElementById('eye-btn');
            if(txt.innerText.includes('••••')) {
                txt.innerText = realKey;
                eye.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                txt.innerText = '••••••••••••••••';
                eye.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        const categories = {
            inicio: (stats, u) => {
                realKey = u.apikey;
                const topUsers = stats.topUsers.map((user, i) => `
                    <div class="user-card">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div class="rank-badge ${i==0?'rank-1':''}" style="background:${i==0?'':'rgba(255,255,255,0.1)'}">#${i+1}</div>
                            <div style="width:38px; height:38px; background:var(--code-bg); border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:bold;">${user.username[0].toUpperCase()}</div>
                            <span style="font-weight:700;">${user.username}</span>
                        </div>
                        <span style="color:var(--neon-blue); font-weight:bold; font-size:0.8rem; background:rgba(0,243,255,0.1); padding:5px 12px; border-radius:10px;">${user.requests} reqs</span>
                    </div>
                `).join('');

                return `
                <section style="text-align:center; padding: 20px 0;">
                    <img src="${u.profile_img || 'https://upload.yotsuba.giize.com/u/oco-1ZRU.jpg'}" class="hero-img">
                    <h1 style="margin:0; font-size:1.5rem;">SISTEMA <span style="color:var(--neon-pink)">ACTIVO</span></h1>
                    <p style="color:var(--text-muted); font-size:0.7rem; font-weight:bold; letter-spacing:1px;">ID: ${u.id}</p>
                </section>

                <div class="api-card">
                    <p class="nav-category" style="margin-top:0">Mi API Key</p>
                    <div class="key-container">
                        <span class="key-text" id="key-val">••••••••••••••••</span>
                        <div class="key-actions">
                            <i class="fas fa-eye" id="eye-btn" onclick="toggleKey()"></i>
                            <i class="fas fa-copy" onclick="copyKey()"></i>
                        </div>
                    </div>
                </div>

                <div class="api-card">
                    <p class="nav-category" style="margin-top:0">Actividad de tu API</p>
                    <div style="height:180px;"><canvas id="myChart"></canvas></div>
                </div>

                <div class="api-card">
                    <p class="nav-category" style="margin-top:0">Plataforma</p>
                    <div class="stats-grid">
                        <div class="stat-box" style="grid-column: span 2;">
                            <p class="stat-label">Usuarios Totales</p>
                            <p class="stat-value">${stats.totalUsers}</p>
                        </div>
                        <div class="stat-box">
                            <p class="stat-label">Total Reqs</p>
                            <p class="stat-value">${stats.totalRequests}</p>
                        </div>
                        <div class="stat-box" style="border-left-color:var(--neon-pink)">
                            <p class="stat-label">Uptime</p>
                            <p class="stat-value" style="color:var(--neon-pink)">Activo</p>
                        </div>
                    </div>
                </div>

                <div class="api-card">
                    <p class="nav-category" style="margin-top:0">Top Users</p>
                    ${topUsers}
                </div>`;
            }
        };

        async function showCategory(cat) {
            const area = document.getElementById('content-area');
            const pre = document.getElementById('preloader');
            pre.style.display = 'flex';
            pre.style.opacity = '1';

            try {
                const [resUser, resStats] = await Promise.all([
                    fetch(`/api/auth/user/${session.id}`),
                    fetch('/api/stats/global')
                ]);
                const userData = await resUser.json();
                const statsData = await resStats.json();

                area.innerHTML = categories.inicio(statsData, userData.user);

                const ctx = document.getElementById('myChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['L', 'M', 'X', 'J', 'V', 'S', 'D'],
                        datasets: [{
                            data: [5, 15, 8, 20, 12, 35, 25],
                            borderColor: '#00f3ff',
                            borderWidth: 3,
                            tension: 0.4,
                            fill: true,
                            backgroundColor: 'rgba(0, 243, 255, 0.05)',
                            pointRadius: 0
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: '#444' } } } }
                });

            } catch (e) { area.innerHTML = "Error al conectar."; }

            setTimeout(() => { pre.style.opacity = '0'; setTimeout(() => pre.style.display='none', 500); }, 1000);
        }

        window.onload = () => showCategory('inicio');
    </script>
</body>
</html>
