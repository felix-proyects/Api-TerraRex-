<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Api Kazuma | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-pink: #ff2d55;
            --neon-blue: #00f3ff;
            --dark-bg: #0d0d0d;
            --card-bg: #1a1a2e;
            --sidebar-bg: #121212;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --code-bg: #252545;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--sidebar-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky; top: 0; z-index: 1000;
        }

        .brand { font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; }
        .brand span { color: var(--neon-pink); }
        .hamburger { font-size: 1.4rem; cursor: pointer; }

        .sidebar {
            position: fixed; top: 0; right: -100%; width: 85%; max-width: 300px; height: 100%;
            background: var(--sidebar-bg); transition: 0.3s ease-in-out; z-index: 2000;
            padding: 30px 20px; box-sizing: border-box; overflow-y: auto;
        }
        .sidebar.active { right: 0; }
        .sidebar-link {
            display: flex; align-items: center; gap: 15px; color: var(--text-main);
            text-decoration: none; padding: 12px; border-radius: 10px; margin-bottom: 5px;
            background: rgba(255,255,255,0.03); cursor: pointer; font-size: 0.9rem;
        }
        .nav-category { color: var(--neon-blue); font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin: 20px 0 10px 5px; }

        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; box-sizing: border-box; flex-grow: 1; }

        .hero { text-align: center; padding: 30px 10px; }
        .hero-img { width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--neon-pink); margin-bottom: 15px; object-fit: cover; }

        .api-card {
            background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .stat-item { background: var(--code-bg); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 3px solid var(--neon-blue); }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-value { font-size: 1.2rem; font-weight: bold; color: var(--neon-blue); }

        .top-user-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .code-box {
            background: var(--code-bg); padding: 10px; border-radius: 10px; font-family: monospace;
            font-size: 0.8rem; color: var(--neon-blue); margin-bottom: 10px; overflow-x: auto;
        }

        .input-test {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            padding: 12px; border-radius: 10px; color: white; margin-bottom: 10px; outline: none; box-sizing: border-box;
        }
        .btn-test {
            background: var(--neon-pink); color: white; border: none; padding: 12px 20px;
            border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        .result-box {
            background: #080815; color: #00ffcc; padding: 15px; border-radius: 10px;
            margin-top: 15px; font-size: 0.75rem; font-family: monospace; border: 1px solid rgba(0, 255, 204, 0.1);
            white-space: pre-wrap; word-break: break-all;
        }

        .footer { text-align: center; padding: 30px; color: var(--text-muted); font-size: 0.8rem; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 1500; }
        .overlay.active { display: block; }
        #admin-btn { display: none; border-left: 3px solid #fbbf24; }
    </style>
</head>
<body>

    <header>
        <div class="brand">API <span>KAZUMA</span></div>
        <div class="hamburger" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="sidebar" id="sidebar">
        <div style="text-align: right; margin-bottom: 20px;" onclick="toggleMenu()"><i class="fas fa-times"></i></div>
        
        <div id="admin-nav">
            <p class="nav-category">Administración</p>
            <div id="admin-btn" class="sidebar-link" onclick="location.href='/admin'"><i class="fas fa-user-shield"></i> Panel Admin</div>
        </div>

        <p class="nav-category">Navegación</p>
        <div class="sidebar-link" onclick="showCategory('inicio')"><i class="fas fa-home"></i> Inicio</div>
        <div class="sidebar-link" onclick="location.href='/profile.html'"><i class="fas fa-user"></i> Perfil</div>

        <p class="nav-category">Endpoints</p>
        <div class="sidebar-link" onclick="showCategory('descargas')"><i class="fas fa-download"></i> Descargas</div>
        <div class="sidebar-link" onclick="showCategory('herramientas')"><i class="fas fa-tools"></i> Herramientas</div>
        
        <div class="sidebar-link" style="margin-top:20px; color:var(--neon-pink);" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Salir</div>
    </nav>

    <div class="container" id="content-area"></div>

    <footer class="footer">
        <p>Copyright © 2026 Api Kazuma. All rights reserved.<br>Félix Ofc & KurayamiTeam</p>
    </footer>

    <script>
        const user = JSON.parse(localStorage.getItem('userSession'));
        if (!user) window.location.href = '/login.html';

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function logout() {
            localStorage.removeItem('userSession');
            window.location.href = '/login.html';
        }

        async function testApi(endpoint, inputId, resultId, isQr = false) {
            let val = document.getElementById(inputId).value;
            const resBox = document.getElementById(resultId);
            if (!val) return alert("Ingresa un valor");
            resBox.innerHTML = "Procesando...";
            try {
                const url = endpoint.includes('?') ? `${endpoint}${val}&apikey=${user.apikey}` : `${endpoint}${val}?apikey=${user.apikey}`;
                const response = await fetch(url);
                if (isQr) {
                    resBox.innerHTML = `<img src="${url.replace(/\s+/g, '+')}" style="width:200px;margin:auto;display:block;">`;
                } else {
                    const data = await response.json();
                    resBox.innerHTML = JSON.stringify(data, null, 2);
                }
            } catch (err) { resBox.innerHTML = "Error de conexión."; }
        }

        const categories = {
            inicio: async () => {
                const res = await fetch('/api/stats/global');
                const stats = await res.json();
                
                const activeUsers = stats.topUsers.filter(u => u.requests > 0);

                return `
                <section class="hero">
                    <img src="https://upload.yotsuba.giize.com/u/oco-1ZRU.jpg" class="hero-img">
                    <h1>BIENVENIDO <span>${user.username.toUpperCase()}</span></h1>
                    <p style="color:var(--text-muted);">ID: ${user.id} | Protocolo Activo</p>
                </section>
                <div class="api-card">
                    <p class="nav-category" style="margin-top:0">Estadísticas Globales</p>
                    <div class="stat-item"><div class="stat-label">Solicitudes Totales</div><div class="stat-value">${stats.totalRequests}</div></div>
                    <div class="stat-item"><div class="stat-label">Endpoints Activos</div><div class="stat-value">${stats.totalEndpoints}</div></div>
                </div>
                <div class="api-card">
                    <p class="nav-category" style="margin-top:0">Top Usuarios Activos</p>
                    ${activeUsers.length > 0 
                        ? activeUsers.map(u => `<div class="top-user-item"><span>${u.username}</span><span style="color:var(--neon-blue)">${u.requests} reqs</span></div>`).join('')
                        : `<p style="color:var(--text-muted); font-size:0.8rem; text-align:center;">No hay actividad reciente</p>`
                    }
                </div>`;
            },
            descargas: `
                <h2 style="border-left:4px solid var(--neon-pink);padding-left:10px">Descargas</h2>
                <div class="api-card">
                    <p><i class="fab fa-tiktok"></i> TikTok</p>
                    <div class="code-box">/api/download/tiktok?url=&apikey=${user.apikey}</div>
                    <input id="in-tk" class="input-test" placeholder="URL de TikTok">
                    <button class="btn-test" onclick="testApi('/api/download/tiktok?url=', 'in-tk', 'res-tk')">Probar</button>
                    <div id="res-tk" class="result-box">...</div>
                </div>
                <div class="api-card">
                    <p><i class="fab fa-instagram"></i> Instagram</p>
                    <div class="code-box">/api/download/instagram?url=&apikey=${user.apikey}</div>
                    <input id="in-ig" class="input-test" placeholder="URL de Instagram">
                    <button class="btn-test" onclick="testApi('/api/download/instagram?url=', 'in-ig', 'res-ig')">Probar</button>
                    <div id="res-ig" class="result-box">...</div>
                </div>
                <div class="api-card">
                    <p><i class="fab fa-facebook"></i> Facebook</p>
                    <div class="code-box">/api/download/facebook?url=&apikey=${user.apikey}</div>
                    <input id="in-fb" class="input-test" placeholder="URL de Facebook">
                    <button class="btn-test" onclick="testApi('/api/download/facebook?url=', 'in-fb', 'res-fb')">Probar</button>
                    <div id="res-fb" class="result-box">...</div>
                </div>
                <div class="api-card">
                    <p><i class="fab fa-youtube"></i> YouTube MP4</p>
                    <div class="code-box">/api/download/youtube/mp4?url=&apikey=${user.apikey}</div>
                    <input id="in-y4" class="input-test" placeholder="URL de YouTube">
                    <button class="btn-test" onclick="testApi('/api/download/youtube/mp4?url=', 'in-y4', 'res-y4')">Probar</button>
                    <div id="res-y4" class="result-box">...</div>
                </div>
                <div class="api-card">
                    <p><i class="fab fa-twitter"></i> Twitter</p>
                    <div class="code-box">/api/download/twitter?url=&apikey=${user.apikey}</div>
                    <input id="in-tw" class="input-test" placeholder="URL de Twitter">
                    <button class="btn-test" onclick="testApi('/api/download/twitter?url=', 'in-tw', 'res-tw')">Probar</button>
                    <div id="res-tw" class="result-box">...</div>
                </div>`,
            herramientas: `
                <h2 style="border-left:4px solid var(--neon-pink);padding-left:10px">Herramientas</h2>
                <div class="api-card">
                    <p><i class="fas fa-qrcode"></i> QR Generator</p>
                    <div class="code-box">/api/tools/qr?text=&apikey=${user.apikey}</div>
                    <input id="in-qr" class="input-test" placeholder="Texto para el QR">
                    <button class="btn-test" onclick="testApi('/api/tools/qr?text=', 'in-qr', 'res-qr', true)">Generar</button>
                    <div id="res-qr" class="result-box">...</div>
                </div>`
        };

        async function showCategory(cat) {
            const area = document.getElementById('content-area');
            area.innerHTML = typeof categories[cat] === 'function' ? await categories[cat]() : categories[cat];
            if (document.getElementById('sidebar').classList.contains('active')) toggleMenu();
        }

        window.onload = () => {
            if (user.role === 'admin') document.getElementById('admin-btn').style.display = 'flex';
            showCategory('inicio');
        };
    </script>
</body>
</html>
