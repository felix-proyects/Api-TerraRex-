<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Api Kazuma | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-pink: #ff2d55; --neon-blue: #00f3ff; --dark-bg: #0d0d0d;
            --card-bg: #161625; --sidebar-bg: #121212; --text-main: #ffffff;
            --text-muted: #a0a0a0; --code-bg: #212135;
        }
        body { background-color: var(--dark-bg); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* LOADER 4s */
        #preloader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease; }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(0, 243, 255, 0.1); border-top: 3px solid var(--neon-blue); border-radius: 50%; animation: spin 1s linear infinite; box-shadow: 0 0 15px var(--neon-blue); }
        .loading-text { margin-top: 20px; font-size: 0.7rem; font-weight: 900; letter-spacing: 2px; color: var(--neon-blue); text-transform: uppercase; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        header { background-color: var(--sidebar-bg); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); position: sticky; top: 0; z-index: 1000; }
        .brand { font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; cursor: pointer; }
        .brand span { color: var(--neon-pink); }
        .sidebar { position: fixed; top: 0; right: -100%; width: 85%; max-width: 300px; height: 100%; background: var(--sidebar-bg); transition: 0.3s ease-in-out; z-index: 2000; padding: 30px 20px; box-sizing: border-box; overflow-y: auto; }
        .sidebar.active { right: 0; }
        .sidebar-link { display: flex; align-items: center; gap: 15px; color: var(--text-main); text-decoration: none; padding: 14px; border-radius: 12px; margin-bottom: 8px; background: rgba(255,255,255,0.03); cursor: pointer; font-size: 0.9rem; font-weight: 600; }
        .nav-category { color: var(--neon-blue); font-size: 0.7rem; font-weight: 900; text-transform: uppercase; margin: 25px 0 10px 5px; letter-spacing: 1.5px; }
        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; box-sizing: border-box; flex-grow: 1; }
        .api-card { background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .hero { text-align: center; padding: 30px 10px; }
        .hero-img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--neon-pink); margin-bottom: 15px; box-shadow: 0 0 20px rgba(255, 45, 85, 0.3); }
        .stat-box { background: var(--code-bg); padding: 20px; border-radius: 18px; border-left: 4px solid var(--neon-blue); margin-bottom: 10px; }
        .user-card { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 12px 15px; border-radius: 18px; margin-bottom: 8px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 1500; backdrop-filter: blur(4px); }
        .overlay.active { display: block; }
        .footer { text-align: center; padding: 25px 20px; color: var(--text-muted); font-size: 0.7rem; }
    </style>
</head>
<body>
    <div id="preloader"><div class="spinner"></div><div class="loading-text">Cargando API...</div></div>
    <header>
        <div class="brand" onclick="location.href='/'">KAZUMA <span>DASH</span></div>
        <div onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    </header>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <nav class="sidebar" id="sidebar">
        <div style="text-align: right; margin-bottom: 20px;" onclick="toggleMenu()"><i class="fas fa-times"></i></div>
        <div id="admin-nav" style="display:none;">
            <p class="nav-category">Staff Control</p>
            <div class="sidebar-link" onclick="location.href='/admin'"><i class="fas fa-user-shield"></i> Panel Admin</div>
        </div>
        <p class="nav-category">Menú Principal</p>
        <div class="sidebar-link" onclick="showCategory('inicio')"><i class="fas fa-th-large"></i> Dashboard</div>
        <div class="sidebar-link" onclick="location.href='/profile'"><i class="fas fa-user-circle"></i> Mi Perfil</div>
        <p class="nav-category">Servicios API</p>
        <div class="sidebar-link" onclick="location.href='/endpoints/descargas'"><i class="fas fa-cloud-download-alt"></i> Descargas</div>
        <div class="sidebar-link" onclick="location.href='/endpoints/search'"><i class="fas fa-search"></i> Búsquedas</div>
        <div class="sidebar-link" onclick="location.href='/endpoints/tools'"><i class="fas fa-tools"></i> Herramientas</div>
        <div class="sidebar-link" style="margin-top:30px; color:var(--neon-pink);" onclick="logout()"><i class="fas fa-power-off"></i> Cerrar Sesión</div>
    </nav>
    <div class="container" id="content-area"></div>
    <footer class="footer">Copyright © 2026 API Kazuma</footer>

    <script>
        const user = JSON.parse(localStorage.getItem('userSession'));
        if (!user) window.location.href = '/login';
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
        function logout() { localStorage.clear(); window.location.href = '/login'; }

        const categories = {
            inicio: async () => {
                const res = await fetch('/api/stats/global');
                const stats = await res.json();
                return `
                <section class="hero">
                    <img src="https://upload.yotsuba.giize.com/u/oco-1ZRU.jpg" class="hero-img">
                    <h1>SISTEMA <span>ACTIVO</span></h1>
                </section>
                <div class="api-card">
                    <div class="stat-box"><div style="font-size:0.7rem; color:gray;">REQS GLOBALES</div><div style="font-size:1.5rem; font-weight:900;">${stats.totalRequests.toLocaleString()}</div></div>
                </div>`;
            }
        };

        async function showCategory(cat) {
            const startTime = Date.now();
            const area = document.getElementById('content-area');
            area.innerHTML = await categories[cat]();
            const remaining = Math.max(0, 4000 - (Date.now() - startTime));
            setTimeout(() => {
                const p = document.getElementById('preloader');
                p.style.opacity = '0';
                setTimeout(() => p.style.display = 'none', 500);
            }, remaining);
        }
        window.onload = () => {
            if (user.role === 'admin') document.getElementById('admin-nav').style.display = 'block';
            showCategory('inicio');
        };
    </script>
</body>
</html>
