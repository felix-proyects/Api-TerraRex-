<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Api Kazuma | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-pink: #ff2d55;
            --neon-blue: #00f3ff;
            --dark-bg: #0d0d0d;
            --card-bg: #161625;
            --sidebar-bg: #121212;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --code-bg: #212135;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--sidebar-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky; top: 0; z-index: 1000;
        }
        .brand { font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; }
        .brand span { color: var(--neon-pink); }

        .sidebar {
            position: fixed; top: 0; right: -100%; width: 85%; max-width: 300px; height: 100%;
            background: var(--sidebar-bg); transition: 0.3s ease-in-out; z-index: 2000;
            padding: 30px 20px; box-sizing: border-box; overflow-y: auto;
        }
        .sidebar.active { right: 0; }
        .sidebar-link {
            display: flex; align-items: center; gap: 15px; color: var(--text-main);
            text-decoration: none; padding: 14px; border-radius: 12px; margin-bottom: 8px;
            background: rgba(255,255,255,0.03); cursor: pointer; font-size: 0.9rem; font-weight: 600;
        }
        .nav-category { color: var(--neon-blue); font-size: 0.7rem; font-weight: 900; text-transform: uppercase; margin: 25px 0 10px 5px; letter-spacing: 1.5px; }

        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; box-sizing: border-box; flex-grow: 1; }

        .hero { text-align: center; padding: 30px 10px; }
        .hero-img { 
            width: 110px; height: 110px; border-radius: 50%; 
            border: 3px solid var(--neon-pink); margin-bottom: 15px; 
            object-fit: cover; box-shadow: 0 0 20px rgba(255, 45, 85, 0.3);
        }

        .api-card {
            background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stat-box { 
            background: var(--code-bg); padding: 20px; border-radius: 18px; 
            border-left: 4px solid var(--neon-blue); margin-bottom: 12px;
        }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; }
        .stat-value { font-size: 1.4rem; font-weight: 900; font-family: 'JetBrains Mono', monospace; }

        .user-card {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.03); padding: 12px 15px; border-radius: 15px; margin-bottom: 8px;
        }
        .user-avatar-mini { width: 35px; height: 35px; border-radius: 10px; background: var(--neon-pink); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem; }

        .code-box {
            background: #0d0d1a; padding: 12px; border-radius: 12px; font-family: monospace;
            font-size: 0.75rem; color: var(--neon-blue); margin: 15px 0; border: 1px solid rgba(0,243,255,0.1); overflow-x: auto;
        }
        .input-test {
            width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1);
            padding: 14px; border-radius: 12px; color: white; margin-bottom: 10px; outline: none; box-sizing: border-box;
        }
        .btn-test {
            background: var(--neon-pink); color: white; border: none; padding: 14px; width: 100%;
            border-radius: 12px; font-weight: 900; text-transform: uppercase; cursor: pointer;
        }

        .result-box {
            background: #05050a; color: #00ffcc; padding: 15px; border-radius: 12px;
            margin-top: 15px; font-size: 0.7rem; font-family: monospace; border: 1px solid rgba(0, 255, 204, 0.1);
            white-space: pre-wrap; word-break: break-all; max-height: 250px; overflow-y: auto;
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 1500; backdrop-filter: blur(4px); }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <header>
        <div class="brand">KAZUMA <span>DASH</span></div>
        <div class="hamburger" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="sidebar" id="sidebar">
        <div style="text-align: right; padding: 10px;" onclick="toggleMenu()"><i class="fas fa-times"></i></div>
        <div id="admin-nav" style="display:none;">
            <p class="nav-category">Staff Control</p>
            <div class="sidebar-link" style="border-left: 4px solid #fbbf24;" onclick="location.href='/admin'"><i class="fas fa-user-shield"></i> Panel Admin</div>
        </div>
        <p class="nav-category">Menú</p>
        <div class="sidebar-link" onclick="showCategory('inicio')"><i class="fas fa-th-large"></i> Dashboard</div>
        <div class="sidebar-link" onclick="location.href='/profile.html'"><i class="fas fa-user-circle"></i> Mi Perfil</div>
        <p class="nav-category">Endpoints</p>
        <div class="sidebar-link" onclick="showCategory('descargas')"><i class="fas fa-cloud-download-alt"></i> Descargas</div>
        <div class="sidebar-link" onclick="showCategory('herramientas')"><i class="fas fa-tools"></i> Herramientas</div>
        <div class="sidebar-link" style="margin-top:20px; color:var(--neon-pink);" onclick="logout()"><i class="fas fa-power-off"></i> Salir</div>
    </nav>

    <div class="container" id="content-area"></div>

    <script>
        const user = JSON.parse(localStorage.getItem('userSession'));
        if (!user) window.location.href = '/login.html';

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function logout() { localStorage.clear(); window.location.href = '/login.html'; }

        function formatUptime(startTime) {
            const diff = Date.now() - startTime;
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff / 3600000) % 24);
            const m = Math.floor((diff / 60000) % 60);
            const s = Math.floor((diff / 1000) % 60);
            return `${d}:${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        const categories = {
            inicio: async () => {
                const res = await fetch('/api/stats/global');
                const stats = await res.json();
                const serverStart = stats.serverStart || (Date.now() - 3600000);
                return `
                <section class="hero">
                    <img src="https://upload.yotsuba.giize.com/u/oco-1ZRU.jpg" class="hero-img">
                    <h1>DASHBOARD <span>KAZUMA</span></h1>
                </section>
                <div class="api-card">
                    <div class="stat-box"><div class="stat-label">Solicitudes Totales</div><div class="stat-value">${stats.totalRequests.toLocaleString()}</div></div>
                    <div class="stat-box" style="border-left-color: var(--neon-pink);"><div class="stat-label">Server Uptime</div><div id="uptime-val" class="stat-value">${formatUptime(serverStart)}</div></div>
                </div>
                <div class="api-card">
                    <p class="nav-category" style="margin-top:0">Top Usuarios</p>
                    ${stats.topUsers.slice(0,5).map(u => `
                        <div class="user-card">
                            <div style="display:flex;align-items:center;gap:10px">
                                <div class="user-avatar-mini">${u.username.substring(0,2).toUpperCase()}</div>
                                <span style="font-weight:700">${u.username}</span>
                            </div>
                            <span style="color:var(--neon-blue);font-weight:800">${u.requests} reqs</span>
                        </div>
                    `).join('')}
                </div>`;
            },
            descargas: `
                <h2 style="border-left:5px solid var(--neon-pink); padding-left:15px; font-weight:900; margin-bottom:20px;">DESCARGAS</h2>
                
                <div class="api-card">
                    <p style="font-weight:800"><i class="fab fa-tiktok"></i> TIKTOK</p>
                    <div class="code-box">/api/download/tiktok?url=...&apikey=${user.apikey}</div>
                    <input id="in-tk" class="input-test" placeholder="URL de TikTok">
                    <button class="btn-test" onclick="testApi('/api/download/tiktok?url=', 'in-tk', 'res-tk')">Ejecutar</button>
                    <div id="res-tk" class="result-box">...</div>
                </div>

                <div class="api-card">
                    <p style="font-weight:800"><i class="fab fa-instagram"></i> INSTAGRAM</p>
                    <div class="code-box">/api/download/instagram?url=...&apikey=${user.apikey}</div>
                    <input id="in-ig" class="input-test" placeholder="URL de Instagram">
                    <button class="btn-test" onclick="testApi('/api/download/instagram?url=', 'in-ig', 'res-ig')">Ejecutar</button>
                    <div id="res-ig" class="result-box">...</div>
                </div>

                <div class="api-card">
                    <p style="font-weight:800"><i class="fab fa-facebook"></i> FACEBOOK</p>
                    <div class="code-box">/api/download/facebook?url=...&apikey=${user.apikey}</div>
                    <input id="in-fb" class="input-test" placeholder="URL de Facebook">
                    <button class="btn-test" onclick="testApi('/api/download/facebook?url=', 'in-fb', 'res-fb')">Ejecutar</button>
                    <div id="res-fb" class="result-box">...</div>
                </div>

                <div class="api-card">
                    <p style="font-weight:800"><i class="fab fa-youtube"></i> YOUTUBE MP4</p>
                    <div class="code-box">/api/download/youtube/mp4?url=...&apikey=${user.apikey}</div>
                    <input id="in-y4" class="input-test" placeholder="URL de YouTube">
                    <button class="btn-test" onclick="testApi('/api/download/youtube/mp4?url=', 'in-y4', 'res-y4')">Ejecutar</button>
                    <div id="res-y4" class="result-box">...</div>
                </div>

                <div class="api-card">
                    <p style="font-weight:800"><i class="fab fa-twitter"></i> TWITTER (X)</p>
                    <div class="code-box">/api/download/twitter?url=...&apikey=${user.apikey}</div>
                    <input id="in-tw" class="input-test" placeholder="URL de Twitter">
                    <button class="btn-test" onclick="testApi('/api/download/twitter?url=', 'in-tw', 'res-tw')">Ejecutar</button>
                    <div id="res-tw" class="result-box">...</div>
                </div>`,
            herramientas: `
                <h2 style="border-left:5px solid var(--neon-blue); padding-left:15px; font-weight:900; margin-bottom:20px;">HERRAMIENTAS</h2>
                <div class="api-card">
                    <p style="font-weight:800"><i class="fas fa-qrcode"></i> QR GENERATOR</p>
                    <div class="code-box">/api/tools/qr?text=...&apikey=${user.apikey}</div>
                    <input id="in-qr" class="input-test" placeholder="Texto o Enlace">
                    <button class="btn-test" style="background:var(--neon-blue);color:black" onclick="testApi('/api/tools/qr?text=', 'in-qr', 'res-qr', true)">Generar</button>
                    <div id="res-qr" class="result-box" style="text-align:center">...</div>
                </div>`
        };

        async function showCategory(cat) {
            const area = document.getElementById('content-area');
            area.innerHTML = typeof categories[cat] === 'function' ? await categories[cat]() : categories[cat];
            if (cat === 'inicio') {
                const res = await fetch('/api/stats/global');
                const stats = await res.json();
                setInterval(() => {
                    const el = document.getElementById('uptime-val');
                    if (el) el.innerText = formatUptime(stats.serverStart || Date.now());
                }, 1000);
            }
            if (document.getElementById('sidebar').classList.contains('active')) toggleMenu();
        }

        async function testApi(endpoint, inputId, resultId, isQr = false) {
            let val = document.getElementById(inputId).value;
            const resBox = document.getElementById(resultId);
            if (!val) return alert("Ingresa un valor");
            resBox.innerHTML = "Cargando...";
            try {
                const url = `${endpoint}${encodeURIComponent(val)}&apikey=${user.apikey}`;
                if (isQr) {
                    resBox.innerHTML = `<img src="${url}" style="width:180px;border:4px solid white;margin:10px auto;border-radius:10px">`;
                } else {
                    const response = await fetch(url);
                    resBox.innerHTML = JSON.stringify(await response.json(), null, 2);
                }
            } catch (err) { resBox.innerHTML = "Error de API."; }
        }

        window.onload = () => {
            if (user.role === 'admin') document.getElementById('admin-nav').style.display = 'block';
            showCategory('inicio');
        };
    </script>
</body>
</html>
